elements:
- type: blank
  location:
    snippet: soda_sum = [0] * num_sodas
  choices:
  - snippet: soda_sum = [0] * num_sodas
    role: solution
    explanations:
    - body: To calculate the average ratings for sodas, we need to first calculate the sum of the ratings
        for the four new flavors of sodas and then divide the sum of the ratings given to each soda by
        the total number of respondents. We need four variables to find the sum of the ratings that each
        of the four new flavors of soda received, which means that a list is a great way to store this
        data. In general, whenever we find ourselves thinking that we need n of some kind of data, we
        should think about using a list of length n. Here, we need four variables for storing the maximum
        rating for each soda; so, we create a list of length 4.
    - body: The first, second, third, and fourth element in the list will be used for storing the sum
        of the ratings that the first, second, third, and fourth soda received. In this statement, we
        create the list and fill it with 0s. The zeros will be later replaced by the ratings from respondents.
    - body: We use the repetition operator * to create the list soda_max. The repetition operator makes
        N copies of this list and joins them all together into a single list, where N is the number of
        sodas stored in variable num_sodas, here, 4. Note that when the operand on the left side of the
        * is a list, it becomes the repetition operator and not the multiplication.
  - snippet: soda_sum = [0] * num_respondents
    role: distractor
- type: blank
  location:
    snippet: 'for i in range(num_sodas):'
    nth: 1
  choices:
  - snippet: 'for i in range(num_sodas):'
    role: solution
    explanations:
    - body: We need to process the rating data and calculate the sum of the ratings for each soda (row
        totals). Our data, that is stored in ratings_data, is a two-dimensional list; therefore, we need
        to use nested for loops to process all of its elements. This statement is the outer for loop in
        the nested loop and it processes the data stored in ratings_data row by row.
    - body: To iterate over the rows in the ratings_data, we need the indexes to start at 0 with every
        integer number up to but not including the number of rows. We get this sequence by calling the
        range(num_sodas) function. Note that variable num_sodas stores the number of rows in the ratings_data.
  - snippet: 'for j in range(num_sodas):'
    role: distractor
- type: blank
  location:
    snippet: 'for j in range(num_respondents):'
  choices:
  - snippet: 'for j in range(num_respondents):'
    role: solution
    explanations:
    - body: This statement is the inner loop of the nested loop. It processes the elements within the
        row i where i is the row index in the ratings_data that changes after each iteration of the outer
        loop. To iterate over the individual elements in each row (i.e., iterating over the columns within
        a row) in the ratings_data, we need the indexes to start at 0 with every integer number up to
        but not including the number of columns. We get this sequence by calling the range(num_respondents)
        function.
    - body: Note that variable num_respondents stores the number of columns in the ratings_data. Also,
        note that the name that we choose for the index in the inner loop should be different from the
        index name in the outer for loop. Here, we choose i for the row index and j for the column index.
  - snippet: 'for i in range(num_respondents):'
    role: distractor
- type: blank
  location:
    snippet: soda_sum[i] += ratings_data[i][j]
  choices:
  - snippet: soda_sum[i] += ratings_data[i][j]
    role: solution
    explanations:
    - body: This statement adds the value of the current element in row i and column j to the element
        in the list soda_sum that stores the sum of the ratings for the soda i+1 in the ratings_data.
    - body: 'More specifically, if i is 0, it adds the current element to the soda_sum[0] that stores
        the sum of the ratings for the Soda #1; if i is 1, it adds the current element to the soda_sum[1]
        that stores the sum of the ratings for the Soda #2; and so on.'
    - body: Note that the += operator adds the value of the element in row i and column j of the ratings_data
        (i.e., element ratings_data[i][j]) to the value of the list element soda_sum[i] and the result
        is stored in the list element soda_sum[i]. Thus, this statement is equivalent to the statement
        soda_sum[i] = soda_sum[i] + ratings_data[i][j].
  - snippet: soda_sum[i] = ratings_data[i][j]
    role: distractor
  - snippet: soda_sum[j] = ratings_data[i][j]
    role: distractor
