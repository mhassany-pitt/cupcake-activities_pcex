id: cc_py_str_count_1
title: Counting the Occurrences of One String in Another
description: |-
  Construct a program that has a function that receives a string and returns the number of times that the string "hi?t" appears anywhere in the given string where '?' could be any letter. For example, "hint" and "hilt" would count as a match.
  All string comparisons should be case-insensitive.
