elements:
- type: blank
  location:
    snippet: 'while num >= 30 and num <= 90 :'
  choices:
  - snippet: 'while num >= 30 and num <= 90 :'
    role: solution
    explanations:
    - body: We need to repeat receiving the integers from the user as long as the user enters an integer
        that is in the range of 30 to 90 both inclusive. Therefore, we need to use a loop structure. Since
        we don't know ahead of time how many times the loop will be repeated, we need to use a while loop.
        The condition in the while loop tests whether the body of the loop should be repeated, so it should
        test whether the input integer is in the range of 30 to 90 both inclusive.<br><br>We could check
        whether the input integer is in the range of 30 to 90 (both inclusive) by checking whether the
        input integer is greater than or equal to 30 and less than or equal to 90.
    - body: The body of the while loop is repeated as long as the user enters an integer that is in the
        range of 30 to 90 both inclusive. The loop terminates when the loop condition evaluates to False,
        that is when the user enters an integer that is not in this range.
    - body: Note that the and operator yields the result True if both conditions are True.
  - snippet: 'while num >= 30 or num <= 90 :'
    role: distractor
  - snippet: 'while num > 30 and num < 90 :'
    role: distractor
  - snippet: 'while num <= 30 or num >= 90 :'
    role: distractor
  - snippet: 'while num <= 30 and num >= 90 :'
    role: distractor
