id: cc_py_concat_char_two_str_1
title: Concatenating Characters of Two Strings
description: |-
  Construct a program that has a function that receives two strings and returns a string formed from the given strings separated by a space character such that the first two characters of the given strings are swapped.
  For example, the new string that will be formed from the strings 'abc' and 'xyz' is 'xyc abz'.
  Assume that both strings have at least two characters.
