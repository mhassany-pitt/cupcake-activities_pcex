elements:
- type: blank
  location:
    snippet: new_a = b[:2] + a[2:]
  choices:
  - snippet: new_a = b[:2] + a[2:]
    role: solution
    explanations:
    - body: This statements sets variable new_a to the string that is formed from the first two characters
        of the 2nd string followed by the 1st string without its first two characters.<br><br>b[:2] fetches
        the first two characters of the 2nd string.<br>a[2:] fetches all characters beyond the second
        character in the 1st string.
    - body: Note that we can get ranges of characters in a string by slicing, that is by providing a pair
        of offsets separated by a colon in square brackets after the string (e.g., s[1:3]). The left offset
        is taken to be the lower bound (inclusive), and the right is the upper bound (non-inclusive).
        That is, Python fetches all characters from the lower bound up to but not including the upper
        bound. If omitted, the left bound defaults to 0 and the right bound defaults to the length of
        the string that we are slicing.
  - snippet: new_a = a[:2] + b[2:]
    role: distractor
  - snippet: new_a = b[2:] + a[:2]
    role: distractor
