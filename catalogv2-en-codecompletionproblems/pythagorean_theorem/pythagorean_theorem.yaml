testcases:
- title: Sample Run
  visible: true
  stdin:
  - '3'
  - '5'
  stdout: |-
    Enter the length of side A:
    Enter the length of the hypotenuse:
    Given that side A is 3.0 and the hypotenuse is 5.0 , side B is 4.0
  console: |-
    Enter the length of side A:
    Enter the length of the hypotenuse:
    Given that side A is 3.0 and the hypotenuse is 5.0 , side B is 4.0
  stderr: ''
  status: pass
elements:
- type: blank
  location:
    snippet: side_B = (square_hypotenuse - square_side_A) ** 0.5
  choices:
  - snippet: side_B = (square_hypotenuse - square_side_A) ** 0.5
    role: solution
    explanations:
    - body: We use Pythagorean theorem to calculate the length of the triangle's other adjacent side.
        We know that hypotenuse ** 2 = side_A ** 2 + side_B ** 2. Therefore, side_B ** 2 = hypotenuse
        ** 2 - side_A ** 2. We could take a square root of both sides of this equation to get the length
        of the other adjacent side in the triangle, that is:<br>side_B = ( hypotenuse ** 2 - side_A **
        2 ) ** 0.5.
    - body: Note that we could take a square root of a number by raising that number to the power of 0.5.
  - snippet: side_B = ( square_hypotenuse + square_side_A ) ** 0.5
    role: distractor
  - snippet: side_B = square_hypotenuse ** 0.5 + square_side_A ** 2
    role: distractor
  - snippet: side_B = ( square_side_A ** 2 - square_hypotenuse ** 2 ) ** 0.5
    role: distractor
  - snippet: side_B = ( square_side_A - square_hypotenuse ) ** 2
    role: distractor
