id: cc_py_pythagorean_theorem_1
title: Pythagorean Theorem
description: Suppose that the user provides two input values for a right-angle triangle. The first input
  is for the length of an adjacent side in the triangle and the second input is for the hypotenuse of
  that triangle. The program calculates the second adjacent side of the triangle using these two input
  values. Use the Pythagorean theorem (c^2 = a^2 + b^2) to find the length of the second adjacent side.
