  location:
    snippet: 'if num % 2 == 0 :'
  choices:
  - snippet: 'if num % 2 == 0 :'
    role: solution
    explanations:
    - body: We could determine whether the integer is even or odd by performing one test. This test checks
        whether the integer is even. If the test fails, then we could conclude that the integer is odd.<br><br>We
        use if statement with the remainder (%) operator to test whether the integer is even. The even
        integer must be divisible by 2 i.e. when it is divided by 2, there is a zero remainder.
    - body: The body of this if statement is executed only if the integer is even, that is the remainder
        when the integer is divided by 2 is zero. Note that the % operator returns the remainder of the
        division.
  - snippet: 'if num / 2 == 0 :'
    role: distractor
  - snippet: 'if num % 3 == 0 :'
    role: distractor
  - snippet: 'if num / 3 == 0 :'
    role: distractor
  - snippet: 'if num % 2 != 0 :'
    role: distractor
  - snippet: 'if num % 2 == 1 :'
    role: distractor
  - snippet: 'if num % 3 == 1 :'
    role: distractor
