id: cc_py_queue_queue_1
title: Solving Josephus Problem Challenge
description: Construct a program by using Queue structure to solve a Josephus problem. Josephus problem
  is a counting-out game. N people are in a circle, labeled as 1, 2, 3, … ,n. Given a skip number k, counting
  from the person labeled as 1, in every round, after k number of people are skipped, the next person
  will be counted out of the circle. Repeat the process with the remaining people until only one person
  remains. Then free the last one person. The program should return the last freed  person.
