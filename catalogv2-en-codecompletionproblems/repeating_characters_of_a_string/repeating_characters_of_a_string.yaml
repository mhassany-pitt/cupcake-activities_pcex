id: cc_py_str_repeat_chars_1
title: Repeating Characters of a String
description: |-
  Construct a program that has a function that receives a string and creates a new string that has every other character of the given string, starting with the first character, repeated two times.
  For example, the new string that will be formed from the string 'abcde' is 'aaccee'.
