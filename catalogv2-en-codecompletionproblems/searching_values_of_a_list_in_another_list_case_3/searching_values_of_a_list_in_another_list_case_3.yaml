elements:
- type: blank
  location:
    snippet: counts = [0] * len(lst2)
  choices:
  - snippet: counts = [0] * len(lst2)
    role: solution
    explanations:
    - body: We need N variables to store the number of matches for each element in the 2nd list; that
        means a list is a great way to store this data. Therefore, we need to create a list with the same
        length as the 2nd list and fill it with 0s as we have not started counting yet. In general, the
        element at index i in this list will be used for storing the number of times the element at index
        i in the 2nd list appears in the 1st list.
    - body: The repetition operator * makes N copies of the list [0] and joins them all together into
        a single list, where N is the number of elements in the 2nd list.
    - body: Note that the function len(lst2) returns the number of elements in the 2nd list. Also, note
        that when the operand on the left side of the * is a list, it becomes the repetition operator
        and not the multiplication.
  - snippet: counts = []
    role: distractor
  - snippet: counts = [0] * len(lst1)
    role: distractor
- type: blank
  location:
    snippet: counts[ lst2.index(val2) ] += 1
  choices:
  - snippet: counts[ lst2.index(val2) ] += 1
    role: solution
    explanations:
    - body: This statement increments the number of matches for val2 (the value that we visited in the
        2nd list) by 1 every time we find a match between val2 and a value in the 1st list.<br><br>To
        update the number of matches that corresponds to val2, we need to find the index in the counts
        that corresponds to val2. When we find the index, we increment the value that is stored at that
        index by 1.
    - body: The index function returns the lowest index in 2nd list that val2 appears. Since all elements
        of the 2nd list are unique, each value in the 2nd list appears in only one index; and thus, we
        always get the right index for val2.<br><br> When the returned index is i, we increment the number
        of matches for the value at index i in the 2nd list.
    - body: Note that we do not necessarily have to store the returned value from the index function in
        a variable. We could use the index function call directly as the list index.
    - body: Note that the += operator adds 1 to the value stored in counts[lst2.index(val2)] and the result
        is stored into the element counts[lst2.index(val2)]. Therefore, it is functionally equivalent
        to the statement counts[lst2.index(val2)] = counts[lst2.index(val2)] + 1.
  - snippet: counts[ lst1.index(val2) ] += 1
    role: distractor
  - snippet: counts[ val2 ] += 1
    role: distractor
