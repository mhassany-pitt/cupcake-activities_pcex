id: cc_py_list_rotate_2
title: Rotating the List Values (Case 3)
description: Construct a program that has a function that receives a list of values and returns the list
  rotated to the right by one position so that the value that is currently at the end of the list is moved
  to the front, shifting the remaining values to the right. For example, if the list is [1, 2, 3, 4, 5,
  6], the program will change it to [6, 1, 2, 3, 4, 5].
