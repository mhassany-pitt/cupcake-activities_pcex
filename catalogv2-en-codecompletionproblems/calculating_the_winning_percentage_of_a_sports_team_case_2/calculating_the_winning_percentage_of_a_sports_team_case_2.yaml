elements:
- type: blank
  location:
    snippet: 'while total_games <= 0 :'
  choices:
  - snippet: 'while total_games <= 0 :'
    role: solution
    explanations:
    - body: We need to validate the number that the user has entered and ask for a valid input as long
        as the user enters an invalid number. Therefore, we need to use a loop structure. Since we don't
        know ahead of time how many times the loop will be repeated, we need to use a while loop. The
        condition in the while loop tests whether the body of the loop should be repeated, so it should
        test whether the number that the user entered is an invalid number.<br><br>The input for the number
        of games in the tournament is an invalid number if it is outside the valid range. The number of
        games in the tournament must be greater than zero, therefore, the input is invalid if the user
        enters a number less than or equal to zero.
    - body: The body of the while loop is repeated as long as the user enters a number that is less than
        or equal to zero. The loop terminates when the loop condition evaluates to False, that is when
        the user enters a number greater than zero.
