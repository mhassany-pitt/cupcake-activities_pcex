title: Calculating the Winning Percentage of a Sports Team (Case 2)
description: Construct a program that receives from the user the number of games in a tournament and the
  number of the games that a sports team won in the tournament, and calculates the winning percentage
  of that sports team. The program must ask the user for each of the two inputs until the user enters
  a valid number.
