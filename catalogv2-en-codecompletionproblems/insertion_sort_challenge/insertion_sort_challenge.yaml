elements:
- type: blank
  location:
    snippet: 'while j>=0 and current > data[j]:'
  choices:
  - snippet: 'while j>=0 and current > data[j]:'
    role: solution
    explanations:
    - body: The outer loop iterates through the list sequentially, whereas the inner while loop will iterate
        through the list backwards if the current element is greater than its predecessor. We want the
        algorithm to keep comparing current to larger and larger elements of the list until it finds the
        index it should be at, so we initialize the while loop condition to run until either there are
        no more elements to traverse backwards through, or we find the right place for current to reside
        in the array.
  - snippet: 'while j>0 and current > data[j]:'
    role: distractor
  - snippet: 'while j>=0 and current < data[j]:'
    role: distractor
  - snippet: 'while j>=0 and current < data[j]:'
    role: distractor
- type: blank
  location:
    snippet: data[j+1] = data[j]
  choices:
  - snippet: data[j+1] = data[j]
    role: solution
    explanations:
    - body: If current is smaller than its predecessor, we want to swap their positions. However, we don’t
        want to swap current just yet, because we might end up needing to make more swaps afterwards if
        current still isn’t in the right place. It’s easier to keep track of current’s initial position
        by instead swapping array elements directly, keeping current in reserve assigned to the current
        element of the list (that is, the current element before any swaps happened).
  - snippet: data[j] = data[j+1]
    role: distractor
  - snippet: data[i+1] = data[i]
    role: distractor
