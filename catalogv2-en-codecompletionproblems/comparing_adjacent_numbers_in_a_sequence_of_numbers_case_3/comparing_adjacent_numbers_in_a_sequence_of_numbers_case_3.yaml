id: cc_py_check_adjacent_2
title: Comparing Adjacent Numbers in a Sequence of Numbers (Case 3)
description: |-
  Construct a program that checks whether a sequence of non-zero numbers, entered one at a time, contains adjacent numbers in ascending order. Numbers are said to be in ascending order when they are arranged from the smallest to the largest number. For example, 5, 9, 13, 17 and 21 are arranged in ascending order.
  Note that you need to think what value should the program use to indicate the end of the input.
