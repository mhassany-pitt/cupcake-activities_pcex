elements:
- type: blank
  location:
    snippet: 'while num != 0 :'
  choices:
  - snippet: 'while num != 0 :'
    role: solution
    explanations:
    - body: We need to repeat receiving the number from the user as long as the user enters a non-zero
        number. Therefore, we need to use a loop structure. Since we don't know ahead of time how many
        times the loop will be repeated, we need to use a while loop. The condition in the while loop
        tests whether the body of the loop should be repeated, so it should test whether the input number
        is not equal to the value that indicates the end of the input. In this program, we designate 0
        to indicate the end of the input because it is outside the normal range of numbers that the user
        will enter.
    - body: The body of the while loop is repeated as long as the user enters a number that is different
        from 0. The loop terminates when the loop condition evaluates to False, that is when the user
        enters 0.
- type: blank
  location:
    snippet: 'if num != 0 and num > previous :'
  choices:
  - snippet: 'if num != 0 and num > previous :'
    role: solution
    explanations:
    - body: We need to test if the number that the user entered is different from 0 because 0 indicates
        the end of the input and we need to skip it. We also need to test whether the number that the
        user entered and its previous number are in ascending order. To determine if the two number are
        in ascending order we need to check if the value of variable num is greater than the value of
        variable previous.
    - body: If the number that the user entered is different from zero and greater than its previous number,
        then the body of this if statement gets executed. Otherwise, the body of this if statement is
        skipped.
    - body: Note that the and operator yields the result True if both conditions are True.
  - snippet: 'if num != -1 and previous > num :'
    role: distractor
  - snippet: 'if num = 0 or num > previous :'
    role: distractor
  - snippet: 'if num > previous :'
    role: distractor
  - snippet: 'if previous > num :'
    role: distractor
  - snippet: 'if num != 0 and previous > num :'
    role: distractor
