id: cc_py_file_input_stat_1
title: Reporting File Information
description: Construct a program that receives the full path to an input file from the user, reads that
  file and reports the number of lines, the longest line, the number of words on each line, and the length
  of the longest word on each line. Make sure that the program handles each specific exception that could
  occur. Also, the program must ask the user for a valid file path until the user enters a file path that
  could be accessed without any exception.
