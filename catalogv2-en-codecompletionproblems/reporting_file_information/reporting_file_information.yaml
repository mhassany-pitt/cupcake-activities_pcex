elements:
- type: blank
  location:
    snippet: 'while not valid :'
  choices:
  - snippet: 'while not valid :'
    role: solution
    explanations:
    - body: We need to repeat asking the user to enter the file path as long as the user enters a file
        path that is not valid. Therefore, we need to use a loop structure. Since we don't know ahead
        of time how many times the loop will be repeated, we need to use a while loop. The condition in
        the while loop tests whether the body of the loop should be repeated, so it should test whether
        the file path is not valid.
    - body: We check whether the file path is not valid by inverting the condition that checks whether
        the file path is valid. We invert the condition by using the not operator. Note that the following
        statement is also correct:<br>while valid == False
    - body: Note that the not operator takes a single condition and evaluates to True if that condition
        is False and to False if the condition is True.
    - body: The body of the while loop is repeated as long as the user enters a file path that is not
        valid. The loop terminates when the loop condition evaluates to False, that is when the user enters
        a file path that is valid.
  - snippet: 'while valid :'
    role: distractor
  - snippet: 'if not valid :'
    role: distractor
- type: blank
  location:
    snippet: myfile.close()
    nth: 1
  choices:
  - snippet: myfile.close()
    role: solution
    explanations:
    - body: We need to close the file after opening it; therefore, we use close() to close it and free
        up any system resources taken up by the open file.
- type: blank
  location:
    snippet: valid = True
  choices:
  - snippet: valid = True
    role: solution
    explanations:
    - body: The statement is executed when none of the previous statements in the try block throw an exception.
        In this case, the input file path is valid and we set variable valid to True.
  - snippet: 'if valid == False :'
    role: distractor
