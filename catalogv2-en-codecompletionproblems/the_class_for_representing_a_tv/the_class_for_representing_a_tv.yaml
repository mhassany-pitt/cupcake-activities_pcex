id: cc_objects_classes_tv_1
title: The Class for Representing a TV
description: Construct a class that represents a TV. The class should contain data that represents the
  TV's state (power on or off, current volume level). The state of the TV could be accessed or changed
  only through the getter and setter methods. The class should also include methods to change the state
  of the TV (turn on/off, change volume level). Assume that the volume level is an integer and ranges
  from 1 to 7 (both inclusive).
