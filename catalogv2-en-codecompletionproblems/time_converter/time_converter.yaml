$schema: https://adapt2.sis.pitt.edu/cupcake/schemas/code-completion/0.1.0
source: main.py
license: MIT
locale: en
id: cc_py_time_conversion_1
title: Time Converter
description: Construct a program that obtains hours, minutes, and seconds from an amount of time in milliseconds.
authors:
- first: Kamil
  last: Akhuseyinoglu
  email: moh70@pitt.edu
  affiliation: University of Pittsburgh
pedagogy:
  activity: code-completion
  difficulty: novice
  prereq_topics: []
  topics: []
runtime:
  language: python
  version: 3
statement: Write a program that obtains hours, minutes, and seconds from an amount of time in milliseconds.
testcases:
- title: Sample Run
  visible: true
  stdin:
  - '16803000'
  stdout: "Enter the milliseconds: \n16803000 milliseconds is 4 hours and 40 minutes and 3 seconds."
  console: "Enter the milliseconds: \n16803000 milliseconds is 4 hours and 40 minutes and 3 seconds."
  stderr: ''
  status: pass
elements:
- type: blank
  location:
    snippet: hours = total_secs // 3600
  choices:
  - snippet: hours = total_secs // 3600
    role: solution
    explanations:
    - body: To obtain the hours, we divide the seconds by 3600 because there are 3600 seconds in an hour.
        Note that we want to truncate the fractional part of the result, if there is any. Therefore, we
        need to use the floor division by using // operator.
  - snippet: hours = total_secs / 60
    role: distractor
  - snippet: hours = ( total_secs // 60 ) % 60
    role: distractor
- type: blank
  location:
    snippet: mins = ( total_secs // 60 ) % 60
  choices:
  - snippet: mins = ( total_secs // 60 ) % 60
    role: solution
    explanations:
    - body: To obtain the remaining minutes after taking away the hours, we have to take the remainder
        of the total minutes divided by 60. We get the total minutes by dividing the seconds by 60. Note
        that we want to truncate the fractional part of the result, if there is any. Therefore, we need
        to use the floor division by using // operator.<br>Also note that the % operator returns the remainder
        of the division.
  - snippet: mins = hours // 60
    role: distractor
  - snippet: mins = total_secs % 60
    role: distractor
