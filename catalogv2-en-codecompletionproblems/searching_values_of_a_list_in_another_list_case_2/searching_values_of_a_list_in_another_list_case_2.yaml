elements:
- type: blank
  location:
    snippet: 'for val1 in lst1:'
  choices:
  - snippet: 'for val1 in lst1:'
    role: solution
    explanations:
    - body: We need to iterate through the values in the 1st list to count the total number of times the
        value that we visited in the 2nd list (val2) appear in 1st list. We iterate through the 1st list
        using for loop because for loop can step across any kind of sequence object including lists.
    - body: This for loop assigns the name val1 to each of the values in the 1st list in turn, from left
        to right, and then the statements in the loop body will be executed for each.
    - body: Note that all statements inside the loop need to be indented with respect to the loop header.
  - snippet: 'for val1 in lst2:'
    role: distractor
- type: blank
  location:
    snippet: 'if val2 == val1:'
  choices:
  - snippet: 'if val2 == val1:'
    role: solution
    explanations:
    - body: We check for match between the val1 and val2 using the == operator.
    - body: If the visited value in the 2nd list (val2) matches the visited values in the 1st list (val1),
        then the body of this if statement gets executed. Otherwise, the body of this if statement is
        skipped.
  - snippet: 'if val2 in lst1:'
    role: distractor
  - snippet: 'if val1 == lst2:'
    role: distractor
  - snippet: 'if val1 in lst2:'
    role: distractor
- type: blank
  location:
    snippet: count += 1
  choices:
  - snippet: count += 1
    role: solution
    explanations:
    - body: When we find a match between values of the two list, we increment the total number of matches
        stored in variable count by 1.
    - body: The += operator adds 1 to the value of variable count and the result is stored into the variable
        count. Therefore, it is functionally equivalent to the statement count = count + 1.
