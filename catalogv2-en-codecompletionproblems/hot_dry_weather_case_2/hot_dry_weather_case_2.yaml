title: Hot-Dry Weather (Case 2)
description: Construct a program that determines whether it is either too hot or too dry (or both) based
  on the inputs that it receives from the user.
authors:
- first: Kamil
  last: Akhuseyinoglu
  email: moh70@pitt.edu
  affiliation: University of Pittsburgh
