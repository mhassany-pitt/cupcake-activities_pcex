elements:
- type: blank
  location:
    snippet: return a
  choices:
  - snippet: return a
    role: solution
    explanations:
    - body: When called recursively, b is 0 when a divided by b has a remainder of 0. This means that
        a and b are multiples of each other, and that the great common factor must be a.
  - snippet: return b
    role: distractor
  - snippet: return a%b
    role: distractor
- type: blank
  location:
    snippet: return gcd2(b, a%b)
  choices:
  - snippet: return gcd2(b, a%b)
    role: solution
    explanations:
    - body: If a and b are not multiples of each other to start, we recursively call the gcd() method
        again, but passing in b and the remainder of a%b as the values of a and b respectively. The greatest
        common factor must be between these two numbers because the greatest common factor must be between
        the smaller number, and the remainder between the bigger number divided by the smaller number.
  - snippet: return gcd2(b%a, b)
    role: distractor
  - snippet: return gcd2(a%b, b)
    role: distractor
