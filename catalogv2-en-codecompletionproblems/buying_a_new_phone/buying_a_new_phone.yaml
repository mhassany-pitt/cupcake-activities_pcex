  version: 3
statement: |-
  Write a program that determines whether it is time to buy a new phone based on the inputs that it receives from the user. A new phone should be bought in either of the following cases:
  the phone breaks
  the screen has a problem
  the phone has the random shutdown problem
executions:
- title: Sample Run
  stdin:
  - '0'
  - '1'
  - '1'
