    Enter 1 if the phone is broken, otherwise enter 0:
    Enter 1 if the phone screen is good, otherwise enter 0:
    Enter 1 if the phone has the random shutdown problem, otherwise enter 0:
    Yes! It is time to buy a new phone.
  console: |-
    Enter 1 if the phone is broken, otherwise enter 0:
    Enter 1 if the phone screen is good, otherwise enter 0:
    Enter 1 if the phone has the random shutdown problem, otherwise enter 0:
    Yes! It is time to buy a new phone.
  stderr: ''
