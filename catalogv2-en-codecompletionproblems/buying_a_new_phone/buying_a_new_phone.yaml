elements:
- type: blank
  location:
    snippet: need_phone = is_broken or not screen_is_good or random_shutdown
  choices:
  - snippet: need_phone = is_broken or not screen_is_good or random_shutdown
    role: solution
    explanations:
    - body: We need three conditions to determine if it is the time for a new phone. We use the or operator
        to combine these conditions. The first condition is to test if the phone is broken, the second
        condition is to test if the screen has a problem, and the last one is to test if the phone shutdown
        randomly.
    - body: We could check whether the screen has a problem by inverting the condition that tests whether
        the screen is good. We invert the condition by using not operator.
    - body: Note that the or operator yields the result True if at least one of the conditions is True.
        Also, the not operator takes a single condition and evaluates to True if that condition is False
        and to False if the condition is True.
  - snippet: need_phone = is_broken or not screen_is_good and random_shutdown
    role: distractor
  - snippet: need_phone = is_broken and screen_is_good and random_shutdown
    role: distractor
  - snippet: need_phone = is_broken and screen_is_good and not random_shutdown
    role: distractor
  - snippet: need_phone = is_broken or not screen_is_good or not random_shutdown
    role: distractor
