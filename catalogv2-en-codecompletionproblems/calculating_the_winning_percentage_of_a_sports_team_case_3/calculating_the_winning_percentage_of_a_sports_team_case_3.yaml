id: cc_py_win_percentage_2
title: Calculating the Winning Percentage of a Sports Team (Case 3)
description: Construct a program that receives from the user the number of games that a sports team won
  and tied in a tournament of 12 games and calculates the winning percentage of the sports team, counting
  ties as half wins. The program must ask the user for each of the two inputs until the user enters a
  valid number.
