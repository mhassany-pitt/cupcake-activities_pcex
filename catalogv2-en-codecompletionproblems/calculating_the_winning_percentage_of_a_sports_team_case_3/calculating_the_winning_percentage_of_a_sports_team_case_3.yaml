elements:
- type: blank
  location:
    snippet: 'while ties < 0 or total_games < (ties + wins) :'
  choices:
  - snippet: 'while ties < 0 or total_games < (ties + wins) :'
    role: solution
    explanations:
    - body: We need to validate the number that the user has entered and ask for a valid input as long
        as the user enters an invalid number. Therefore, we need to use a loop structure. Since we don't
        know ahead of time how many times the loop will be repeated, we need to use a while loop. The
        condition in the while loop tests whether the body of the loop should be repeated, so it should
        test whether the number that the user entered is an invalid number.<br><br>The input is an invalid
        number if it is outside the valid range, that is when the number of games tied is negative or
        the total number of games is less than the number of games won and tied put together.
    - body: The body of the while loop is repeated as long as the user enters an integer that is negative
        (less than zero) or when the total number of games is less than the number of games won and tied
        put together. The loop terminates when the loop condition evaluates to False, that is when the
        user enters a non-negative number such that total number of games is greater than or equal to
        the ties and wins put together.<br><br>Note that the logical or operator is True if one or the
        other or both operands are True.
  - snippet: 'while ties <= 0 or ties >= total_games :'
    role: distractor
  - snippet: 'while ties <= 0 or ties >= win or ties >= total_games :'
    role: distractor
- type: blank
  location:
    snippet: ratio = ( wins + ties // 2) / total_games
  choices:
  - snippet: ratio = ( wins + ties // 2) / total_games
    role: solution
    explanations:
    - body: We need to calculate the winning percentage by taking into account both ties and wins. Ties
        are counted as half wins. Therefore, we need to divide the sum of the number of games won and
        ties halved by the total number of games played. We store the result of the division into variable
        ratio.<br><br>Notice that we need to perform a floor division to obtain the value of ties halved
        (by using // operator). On the other hand, when we divide the sum of wins and ties halved by total
        games we need to perform a real division (by using / operator).
    - body: Notice that ties // 2 results in an int because // operator truncates the fractional part
        of the result, if there is any.
  - snippet: ratio = ( wins + ties ) / total_games
    role: distractor
  - snippet: ratio = ( wins + ties / 2) / total_games
    role: distractor
