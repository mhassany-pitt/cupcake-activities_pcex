    explanations:
    - body: This statement, updates the last element of the list to string value "e".
    - body: To update an element in the list, we need to give the square bracket slice operator ([ ] )
        along with an index of the element that we want to update on the left-hand side of the assignment
        operator. The index could start at 0 and continue up to but not including the length of the list.
        The value on the right-hand side of the assignment operator is the new value that we want to assign
        to the list element.
