id: cc_py_list_rotate_3
title: Rotating the List Values (Case 4)
description: Construct a program that has a function that receives a list of values and returns the list
  rotated to the right by 2 position so that the value that is currently at the end of the list is moved
  to the second position, the second last value of the list is moved to the front of the list, and the
  remaining values are shifted to the right. For example, if the list is [1, 2, 3, 4, 5, 6], the program
  will change it to [5, 6, 1, 2, 3, 4].
