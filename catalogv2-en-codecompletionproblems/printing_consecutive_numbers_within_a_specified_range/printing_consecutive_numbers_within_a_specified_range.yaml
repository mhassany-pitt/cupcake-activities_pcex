  choices:
  - snippet: 'for num in range(8, 15):'
    role: solution
    explanations:
    - body: We need to repeat printing the numbers that are in a sequence from 8 (inclusive) to 14 (inclusive).
        To do this, we need to use a loop structure. We use for loops instead of a while loop because
        we need to repeat the loop 7 times, and for loops are best-suited in cases like this when we know
        ahead of time the number of times that we need to repeat the loop.<br><br>We use the range function
        because it generates a sequence of numbers for the for loop. Here, we want a sequence that starts
        at 8 with every integer number up to but not including 15. We get this sequence by calling the
        function range(8,15).
    - body: Note that all statements inside the loop need to be indented with respect to the loop header.
