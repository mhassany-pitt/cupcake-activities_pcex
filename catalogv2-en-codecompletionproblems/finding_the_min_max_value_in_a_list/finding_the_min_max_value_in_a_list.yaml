  choices:
  - snippet: 'if (values[i] < min_value):'
    role: solution
    explanations:
    - body: We need to compare the value at the index i of the list with the minimum value stored in variable
        min_value. If the value at index i is smaller than the minimum value, then we need to set the
        minimum value to the value of the element at index i.
    - body: If the list value at index i is less than the minimum value so far, then the body of this
        if statement gets executed. Otherwise, the body of this if statement is skipped.
  - snippet: 'if (values[i] > min_value):'
    role: distractor
  - snippet: values[i] = min_value
    role: distractor
  - snippet: 'if (values[i+1] > min_value):'
    role: distractor
- type: blank
