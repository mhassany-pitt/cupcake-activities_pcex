title: Stack Challenge
description: |-
  Implementing Stack. Using Class to construct a Stack. Implement a function to determine if all the given brackets are paired.
  For example:
         paired brackets list:['[','{','(','{','}',')','}',']’] ; unpaired brackets list:['{',']','(','{','}',')','}',']']
