  stderr: ''
  status: pass
elements:
- type: blank
  location:
    snippet: 'try :'
    nth: 2
  choices:
  - snippet: 'try :'
    role: solution
    explanations:
    - body: If an error is encountered during getting the id of the employee, the try block code execution
        is stopped and transferred down to the except block(s).
- type: blank
  location:
    snippet: eid = int(tokens[0])
  choices:
  - snippet: eid = int(tokens[0])
    role: solution
    explanations:
    - body: We need to get the id of the employee by accessing the first element in the list of line tokens.
        The id of an employee is a number; therefore, we convert it to a number by calling the int() function.
    - body: tokens[0] gives us the element at index 0 of the list that represents the employee's id.
  - snippet: eid = tokens[0]
    role: distractor
- type: blank
  location:
    snippet: 'except ValueError :'
  choices:
  - snippet: 'except ValueError :'
    role: solution
    explanations:
    - body: We need to handle the ValueError. This error occurs when the employee's id is not a number
        and we call the function int() to convert that value to an int.
    - body: The body of this except block gets executed only if the employee's id is not a number. Otherwise,
        the body of this except statement is skipped.
  - snippet: 'except IndexError :'
    role: distractor
  - snippet: 'except KeyError :'
    role: distractor
- type: blank
  location:
    snippet: print("Error in the employee's id.")
  choices:
  - snippet: print("Error in the employee's id.")
    role: solution
    explanations:
    - body: This statement prints to the default standard output stream the error that caused the ValueError.
        The printed text is followed by the end-of-line character at the end.
  - snippet: print("Error in the employee's name.")
    role: distractor
