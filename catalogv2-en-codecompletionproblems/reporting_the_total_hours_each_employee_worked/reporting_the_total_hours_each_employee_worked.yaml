executions:
- title: Sample Run
  stdin:
  - /Users/hours2.txt
  stdout: "Enter the full path of a file: \nTotal hours worked by Erica = 42.75\nError in the employee's\
    \ id.\nTotal hours worked by Erin = 55.75\nTotal hours worked by Simone = 24.0\nTotal hours worked\
    \ by Ryan = 31.75\nTotal hours worked by Kendall = 5.5"
  console: "Enter the full path of a file: \nTotal hours worked by Erica = 42.75\nError in the employee's\
    \ id.\nTotal hours worked by Erin = 55.75\nTotal hours worked by Simone = 24.0\nTotal hours worked\
