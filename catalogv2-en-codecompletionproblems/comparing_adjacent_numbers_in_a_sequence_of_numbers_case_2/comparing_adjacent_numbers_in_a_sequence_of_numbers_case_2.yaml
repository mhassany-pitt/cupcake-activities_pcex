elements:
- type: blank
  location:
    snippet: 'if num != -1 and num - previous == 1 :'
  choices:
  - snippet: 'if num != -1 and num - previous == 1 :'
    role: solution
    explanations:
    - body: We need to test if the integer that the user entered is different from -1 because -1 indicates
        the end of the input and we need to skip it. We also need to test whether the integer that the
        user entered and its previous integer are consecutive numbers. To determine if the two integers
        are consecutive we need to test whether the difference between the two integers is 1 (consecutive
        numbers must differ by 1).
    - body: If the integer that the user entered is different from -1 and differs by 1 from its previous
        integer, then the body of this if statement gets executed. Otherwise, the body of this if statement
        is skipped.
    - body: Note that the and operator yields the result True if both conditions are True.
  - snippet: 'if num != -1 and num - previous = 1 :'
    role: distractor
  - snippet: 'if num = -1 or num - previous = 1 :'
    role: distractor
  - snippet: 'if num - previous == 1 :'
    role: distractor
  - snippet: 'if num > previous :'
    role: distractor
