elements:
- type: blank
  location:
    snippet: res_dict[ word[0] ].append(word)
  choices:
  - snippet: res_dict[ word[0] ].append(word)
    role: solution
    explanations:
    - body: When the word does not exist in the list mapped to its first character, we call the function
        append(word) to add the word to the end of that list.
  - snippet: res_dict[ word ].append(word)
    role: distractor
  - snippet: res_dict[ word ].append(word[0])
    role: distractor
- type: blank
  location:
    snippet: res_dict[ word[0] ] = [ word ]
  choices:
  - snippet: res_dict[ word[0] ] = [ word ]
    role: solution
    explanations:
    - body: We need to add the first character of the visited word as a new key to the dictionary. We
        need to initialize the value mapped to this key with a list.
  - snippet: res_dict[ word[0] ] = word
    role: distractor
  - snippet: res_dict[ word ] = []
    role: distractor
