title: The Class for Representing a Point in the Euclidean Plane
description: Construct a class that represents a point in the Euclidean plane. The class should contain
  data that represents the point’s integer coordinates (x,y). The point's coordinates could be accessed
  or changed only through the getter and setter methods. The class should also include a method to calculate
  and return the point's distance from the origin (0,0).
