title: Determining Whether One is a Teenager
description: Construct a program that asks the user to enter a string that has the user name and age separated
  by a colon, and prints whether the user is a teenager. Make sure that the program handles all possible
  exceptions. The program must ask the user for an input until the user enters a string that could be
  processed without any exception.
