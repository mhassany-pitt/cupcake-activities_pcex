id: cc_py_search_binary_recursive_1
title: Recursive Binary Search Challenge
description: 'Construct a function that uses recursive binary search to find if a specific value is in
  a list (known as a "key"). Recall: Binary search uses the "Divide and Conquer" strategy. Given a list
  of ordered integers, the key is searched by dividing the data list in half and only searching in the
  half that contains the key, and repeating the process until the key is found and the index of the key
  is returned. If the key is not found, -1 is returned.'
