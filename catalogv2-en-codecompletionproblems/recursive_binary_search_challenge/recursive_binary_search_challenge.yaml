elements:
- type: blank
  location:
    snippet: 'if (key < data[guess]):'
  choices:
  - snippet: 'if (key < data[guess]):'
    role: solution
    explanations:
    - body: If the key is less than the value guessed, "high" is set to "guess" because the key can only
        be in the first half of the list.
  - snippet: if (key < (low+high)//2
    role: distractor
- type: blank
  location:
    snippet: low = guess + 1
  choices:
  - snippet: low = guess + 1
    role: solution
    explanations:
    - body: If the key is greater than the value guessed, "low" is set to "guess + 1" because the key
        can only be in the latter half of the list. +1 is added to "low" so that the "low" and "high"
        will equal if the list has been completely searched.
  - snippet: low = guess
    role: distractor
  - snippet: low = guess - 1
    role: distractor
