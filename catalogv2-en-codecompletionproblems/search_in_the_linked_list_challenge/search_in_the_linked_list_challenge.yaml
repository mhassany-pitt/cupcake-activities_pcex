id: cc_py_linkedlist_searching_1
title: Search in the linked list. Challenge
description: When using a LinkedList, it is possible that you may want to search through the list to see
  if a specific value is in it. To do so, each node must be checked individually. Construct a search function
  within the LinkedList class that traverses through all nodes in the list and keeps track of all instances
  of the target value (if any) are in the LinkedList, returning the final count at the end of the search.
