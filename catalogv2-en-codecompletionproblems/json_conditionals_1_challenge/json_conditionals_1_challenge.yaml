  console: '[{''name'': ''Taco Fiesta'', ''reviews'': 5, ''cuisine'': ''Mexican'', ''spicy_food'': True,
    ''seating'': [2, 4, 6], ''max_reservation'': 30}, {''name'': ''Salsa Heaven'', ''reviews'': 3, ''cuisine'':
