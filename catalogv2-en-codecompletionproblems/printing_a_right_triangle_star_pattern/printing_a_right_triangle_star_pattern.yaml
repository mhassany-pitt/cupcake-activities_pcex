elements:
- type: blank
  location:
    snippet: 'for j in range(1, N-i+2):'
  choices:
  - snippet: 'for j in range(1, N-i+2):'
    role: solution
    explanations:
    - body: This statement is the inner for loop. Each iteration of inner loop will concatenate the string
        value stored in variable row with one asterisk (*). For the i-th row of the inverted right triangle
        star pattern, the inner loop will iterate N-i+1 times; thus, creating a row with N-i+1 asterisks.
        <br><br>For the inner loop, we use the range function because it generates a sequence of numbers
        for the for loop. Here, we want to repeat the loop N-i+1 times; therefore, we need a sequence
        that starts at 1 with every integer number up to but not including N-i+2. We get this sequence
        by calling the function range(1, N-i+2).
    - body: Note that the name that we choose for the loop variable in the inner loop should be different
        from the outer for loop. Here, i is the loop variable in the outer loop and j is the loop variable
        in the inner loop. Also, note that the inner for loop need to be indented with respect to the
        outer for loop.
  - snippet: 'for j in range(N, i, -1):'
    role: distractor
  - snippet: 'for j in range(N-1, i+1, -1):'
    role: distractor
  - snippet: 'for j in range(i, N):'
    role: distractor
  - snippet: for j in range(1, N-i+1)
    role: distractor
