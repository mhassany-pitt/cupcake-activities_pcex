    explanations:
    - body: This statement returns the account attributes. We call format function to format the string
        so that all values are right-aligned with sufficient spacing between values.<br>{:d} is replaced
        by the account number<br>{:>20s} right-justifies the account's name in a field that is 20-characters
        wide<br>{:>10.2f} right-justifies the balance with two decimal digits in a field that is 10-characters
        wide.
    - body: The format function returns the result of replacing each {…} placeholder in the template string
        with its corresponding argument passed to the format function. Anything else, which is not contained
        in curly braces will be literally printed, i.e. without any changes.
    - body: 'Also, the format specification inside a pair of curly braces starts with a : and followed
        by the text that specifies the data type. The data type d requires a decimal argument, the data
        type s requires a string argument, and the data type f requires a floating-point argument. An
        error will occur if the argument is not the expected data type.'
