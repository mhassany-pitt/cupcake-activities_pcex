elements:
- type: blank
  location:
    snippet: dimes = change_due // pennies_per_dime
  choices:
  - snippet: dimes = change_due // pennies_per_dime
    role: solution
    explanations:
    - body: To obtain the dimes in the remaining change due, we have to divide the change due by pennies
        per dime. Note that we want to truncate the fractional part of the result, if there is any. Therefore,
        we need to use the floor division by using // operator.
    - body: Note that the number of pennies per dime is stored in the variable pennies_per_dime.
  - snippet: dimes = change_due % pennies_per_nickel
    role: distractor
  - snippet: dimes = change_due % pennies_per_dime
    role: distractor
- type: blank
  location:
    snippet: change_due = change_due % pennies_per_dime
  choices:
  - snippet: change_due = change_due % pennies_per_dime
    role: solution
    explanations:
    - body: To obtain the remaining change due after taking away the dimes, we have to take the remainder
        of the change due divided by pennies per dime. The % operator returns the remainder of the division.
    - body: Note that the number of pennies per dime is stored in the variable pennies_per_dime.
  - snippet: change_due = change_due // pennies_per_dime
    role: distractor
  - snippet: change_due = change_due - change_due // pennies_per_dime
    role: distractor
