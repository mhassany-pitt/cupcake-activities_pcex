elements:
- type: blank
  location:
    snippet: 'for std_name in new_dict :'
  choices:
  - snippet: 'for std_name in new_dict :'
    role: solution
    explanations:
    - body: We need to iterate over the students in the dictionary and calculate their average score.
        We can get the students by iterating through the keys in the dictionary using a for loop.
    - body: This for loop assigns the name std_name to each of the keys in the dictionary in turn, from
        left to right, and then the statement in the loop body will be executed for each character.<br><br>Note
        that each key in the dictionary represents a student.
    - body: Note that all statements inside the loop need to be indented with respect to the loop header.
  - snippet: 'for i in range(new_dict) :'
    role: distractor
  - snippet: 'for std_name in new_dict[score]:'
    role: distractor
- type: blank
  location:
    snippet: 'for score in new_dict[std_name]:'
  choices:
  - snippet: 'for score in new_dict[std_name]:'
    role: solution
    explanations:
    - body: To calculate the average score of each student, we need to iterate over the list of student's
        scores. We do this by using a for loop that iterates through the list of student's scores.
    - body: This for loop assigns the name score to each of the values in the list of student's score
        in turn, from left to right, and then the statement in the loop body will be executed for each
        character.<br><br>Note that new_dict[std_name] returns the student's scores.
    - body: Note that all statements inside the loop need to be indented with respect to the loop header.
  - snippet: 'for score in new_dict :'
    role: distractor
  - snippet: 'for score in new_dict:'
    role: distractor
- type: blank
  location:
    snippet: average = total/len(new_dict[std_name])
  choices:
  - snippet: average = total/len(new_dict[std_name])
    role: solution
    explanations:
    - body: We calculate the average by dividing the sum of student's scores by the number of student's
        scores.<br><br>The function len(new_dict[std_name]) returns the number of the scores in the list
        that is mapped to the student.
    - body: Note that since we want to keep the fractional part of the division result, we need to use
        the real division by using / operator.
  - snippet: average = total/len(new_dict)
    role: distractor
