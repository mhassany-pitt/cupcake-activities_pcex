id: cc_py_bmi_calculator_1
title: BMI Calculator
description: "BMI is a measure of body fat based on height and weight that applies to adult men and women.\
  \ BMI Categories are as follows: \nUnderweight = <18.5\nNormal weight = 18.5–24.9\nOverweight = 25–29.9\n\
  Obesity = BMI of 30 or greater.\nEnglish BMI Formula (Imperial) is: BMI = (Weight in Pounds / (Height\
  \ in inches x Height in inches)) x 703.\n BMI results are usually displayed as integers (values without\
  \ decimal points). Construct a program to round the BMI result to the nearest integer."
