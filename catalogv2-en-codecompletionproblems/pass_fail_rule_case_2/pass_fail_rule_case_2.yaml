source: main.py
license: MIT
locale: en
id: cc_py_fail_course_1
title: Pass-Fail Rule (Case 2)
description: Construct a program that determines whether a student fails the course based on the inputs
  that it receives from the instructor. The student fails the course if the exam score is less than 55
  or when the student has cheated.
authors:
- first: Kamil
  last: Akhuseyinoglu
  email: moh70@pitt.edu
  affiliation: University of Pittsburgh
pedagogy:
  activity: code-completion
  difficulty: novice
  prereq_topics: []
  topics: []
runtime:
  language: python
  version: 3
statement: Write a program that determines whether a student fails the course based on the inputs that
  it receives from the instructor. The student fails the course if the exam score is less than 55 or when
  the student has cheated.
testcases:
- title: Sample Run
  visible: true
  stdin:
  - '55'
  - '1'
  stdout: |-
    Enter the exam score:
    Enter 1 if the student has cheated, otherwise enter 0:
    Yes! The student fails the course.
  console: |-
    Enter the exam score:
    Enter 1 if the student has cheated, otherwise enter 0:
    Yes! The student fails the course.
  stderr: ''
  status: pass
elements:
- type: blank
  location:
    snippet: is_failing = exam_score < 55 or has_cheated
  choices:
  - snippet: is_failing = exam_score < 55 or has_cheated
    role: solution
    explanations:
    - body: We need two conditions to determine whether a student fails the course. We use the or operator
        to combine the two conditions. The first condition is to test if the exam score is less than 55
        and the second condition is to test if the student has cheated.
    - body: Note that the or operator yields the result True if at least one of the conditions is True.
  - snippet: is_failing = exam_score < 55 or not has_cheated
    role: distractor
  - snippet: is_failing = exam_score < 55 and not has_cheated
    role: distractor
  - snippet: is_failing = not ( exam_score <= 55 ) or not has_cheated
    role: distractor
