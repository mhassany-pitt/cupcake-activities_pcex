runtime:
  language: python
  version: 3
statement: Write a program that determines whether it is too hot but not too dry based on the inputs that
  it receives from the user.
testcases:
- title: Sample Run
  visible: true
  stdin:
  - '1'
  - '0'
  stdout: |-
    Enter 1 if it is too hot, otherwise enter 0:
    Enter 1 if it is too dry, otherwise enter 0:
    Yes! It is too hot but not too dry.
  console: |-
    Enter 1 if it is too hot, otherwise enter 0:
    Enter 1 if it is too dry, otherwise enter 0:
    Yes! It is too hot but not too dry.
  stderr: ''
  status: pass
elements:
- type: blank
  location:
    snippet: result = too_hot and not too_dry
  choices:
  - snippet: result = too_hot and not too_dry
    role: solution
    explanations:
    - body: We need two conditions to determine whether it is too hot but not too dry. We use the and
        operator to combine the two conditions. The first condition is to test if it is too hot and the
        second condition is to test if it is not too dry.
    - body: We test whether it is not too dry by inverting the condition that tests whether it is too
        dry. Note that we invert the condition by using not operator.
    - body: Note that the and operator yields the result True if both conditions are True. Also, note
        that the not operator takes a single condition and evaluates to True if that condition is False
        and to False if the condition is True.
  - snippet: result = too_hot and too_dry
    role: distractor
  - snippet: result = not too_hot or too_dry
    role: distractor
  - snippet: result = not too_hot and too_dry
    role: distractor
  - snippet: result = not ( too_hot or too_dry )
    role: distractor
