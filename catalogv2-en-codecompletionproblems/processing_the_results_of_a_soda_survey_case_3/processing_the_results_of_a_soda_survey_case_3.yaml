elements:
- type: blank
  location:
    snippet: respondent_sum = [0] * num_respondents
  choices:
  - snippet: respondent_sum = [0] * num_respondents
    role: solution
    explanations:
    - body: To calculate the average ratings of a respondent, we need to first calculate the sum of the
        ratings of the respondent and then divide the sum by the number of the ratings that the respondent
        provided. We need ten variables to calculate the sum of the ratings, which means that a list is
        a great way to store this data. In general, whenever we find ourselves thinking that we need n
        of some kind of data, we should think about using a list of length n. Here, we need ten variables
        for storing the sum of the ratings of respondents; so, we create a list of length 10.
    - body: The first, second, ..., and tenth element in the list will be used for storing the sum of
        the ratings of the first, second, ..., and tenth respondent. In this statement, we create the
        list and fill it with 0s because we have not started computing the sum of the ratings yet.
    - body: We use the repetition operator * to create the list respondent_sum. The repetition operator
        makes N copies of this list and joins them all together into a single list, where N is the number
        of respondents stored in variable num_respondents, here, 10. Note that when the operand on the
        left side of the * is a list, it becomes the repetition operator and not the multiplication.
  - snippet: respondent_sum = [0] * num_sodas
    role: distractor
  - snippet: respondent_sum = []
    role: distractor
- type: blank
  location:
    snippet: respondent_sum[j] += ratings_data[i][j]
  choices:
  - snippet: respondent_sum[j] += ratings_data[i][j]
    role: solution
    explanations:
    - body: This statement adds the value of the current element in row i and column j to the element
        in the list respondent_sum that stores the sum of the ratings of the respondent j+1 in the ratings_data.
    - body: 'If j is 0, it adds the current element to the respondent_sum[0] that stores the sum of the
        ratings of the Respondent #1; if j is 1, it adds the current element to the respondent_sum[1]
        that stores the sum of the ratings of the Respondent #2; and so on.'
    - body: Note that the += operator adds the value of the element in row i and column j of the ratings_data
        (i.e., element ratings_data[i][j]) to the value of the list element respondent_sum[j] and the
        result is stored in the list element respondent_sum[j]. Thus, this statement is equivalent to
        the statement respondent_sum[j] = respondent_sum[j] + ratings_data[i][j].
  - snippet: respondent_sum[j] = ratings_data[i][j]
    role: distractor
  - snippet: respondent_sum[i] += ratings_data[i][j]
    role: distractor
  - snippet: respondent_sum[j] += ratings_data[j][i]
    role: distractor
