id: cc_py_soda_survey_2
title: Processing the Results of a Soda Survey (Case 3)
description: |-
  Suppose a soda manufacturer held a taste test for four new flavors to determine if people liked them. The manufacturer got 10 people to try each new flavor and give it a score from 1 to 5, where 1 equals poor and 5 equals excellent. The results of that survey is stored in a matrix. Each row of the matrix holds the responses that all testers gave for one particular soda flavor, and each column holds the responses of one person for all sodas.
  Construct a program that determines the average ratings that respondents provided to four new flavors of soda as well as the average ratings of each respondent.
