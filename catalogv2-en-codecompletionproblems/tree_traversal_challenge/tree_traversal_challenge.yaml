id: cc_py_trees_traversal_1
title: Tree traversal. Challenge
description: |-
  The tree can be traversed by deciding on a sequence to visit each node. There are three traversal algorithms: in-order traversal, pre-order traversal and post-order traversal.
  <b>In-order traversal</b> visits the nodes from the left, the root node and the right
  <b>Pre-order traversal</b> visits the nodes from the root node, the left and the right
  <b>Post-order traversal</b> visits the nodes from the left, the right and the root node.
  In this challenge, we construct an post-order traversal algorithm.
