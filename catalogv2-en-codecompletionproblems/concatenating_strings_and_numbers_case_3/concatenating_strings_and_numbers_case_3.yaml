executions:
- title: Sample Run
  stdin: []
  stdout: 10 + 20 = 30
  console: 10 + 20 = 30
  stderr: ''
  status: pass
elements:
- type: blank
  location:
    snippet: z = x + y
  choices:
  - snippet: z = x + y
    role: solution
    explanations:
    - body: This statement sets variable z to the integer value that is the result of the addition operation.
    - body: The expression on the right-hand side of the assignment operator adds the values stored in
        variable x and y. The result of the addition is an integer value because both operands of the
        addition operator are integers. Note that variables x and y have an integer value.
  - snippet: z = str(x) + str(y)
    role: distractor
  - snippet: z = str(x) + y
    role: distractor
- type: blank
  location:
    snippet: print(str(x) + " + " + str(y) + " = " + str(z))
  choices:
  - snippet: print(str(x) + " + " + str(y) + " = " + str(z))
    role: solution
    explanations:
    - body: This statement concatenates the content of variables x, y, and z to print the requested output.
        We concatenate the content of these variables using the + operator. All three variables have integer
        values and their values could be concatenated with strings only when they are explicitly converted
        to a string using the str function.
    - body: Note that the concatenating and printing are done in the same line. That is, we don't necessarily
        have to store the concatenated string to a new variable at first and then print it in the next
        line.
    - body: Note that the + operator creates a new string from the contents of its operands joined. This
        string will be printed by the print function and followed by the end-of-line character at the
        end.
  - snippet: print(x + " + " + y + " = " + z)
    role: distractor
  - snippet: str(x) + " + " + str(y) + " = " + str(z)
    role: distractor
