elements:
- type: blank
  location:
    snippet: 'for j in range(1, i+1):'
  choices:
  - snippet: 'for j in range(1, i+1):'
    role: solution
    explanations:
    - body: This statement is the inner for loop. Each iteration of inner loop will print the i-th number
        once. For the i-th number, the inner loop will iterate i times; thus, printing the i-th number
        i times.<br><br>For the inner loop, we use the range function because it generates a sequence
        of numbers for the for loop. Here, we want to repeat the loop i times; therefore, we need a sequence
        that starts at 1 with every integer number up to but not including i+1. We get this sequence by
        calling the function range(1,i+1).
    - body: Note that the name that we choose for the loop variable in the inner loop should be different
        from the outer for loop. Here, i is the loop variable in the outer loop and j is the loop variable
        in the inner loop. Also, note that the inner for loop need to be indented with respect to the
        outer for loop.
  - snippet: 'for j in range(1, i):'
    role: distractor
  - snippet: 'for j in range(1, N+1):'
    role: distractor
  - snippet: 'for j in range(1, N-i+1):'
    role: distractor
  - snippet: 'for i in range(i, N-i+1):'
    role: distractor
