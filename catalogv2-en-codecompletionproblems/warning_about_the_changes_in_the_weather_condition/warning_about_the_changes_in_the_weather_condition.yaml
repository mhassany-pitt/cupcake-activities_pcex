id: cc_py_nested_if_temperature_1
title: Warning about the Changes in the Weather Condition
description: Construct a program that receives the temperature and humidity for today and yesterday and
  warns the user when it is getting colder or warmer or neither. When it is getting warmer, the program
  should also warn the user about the changes in humidity. In particular, it should warn the user when
  today's humidity is more, less, or has not changed compared to yesterday's humidity. Note that the temperature
  and humidity values could have a decimal point.
