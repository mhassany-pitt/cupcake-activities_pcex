  - snippet: 'for num in range(1, 10, 2):'
    role: solution
    explanations:
    - body: We need to repeat the same process for each of the odd positive integers that are less than
        10. To do this, we need to use a loop structure. We use for loops instead of a while loop because
        we need to repeat the loop a certain number of times, and for loops are best-suited in cases like
        this when we know ahead of time the number of times that we need to repeat the loop.<br><br>We
        use the range function because it generates a sequence of numbers for the for loop. Here, we want
        a sequence that starts at 1 (1 is the first positive odd number) with every odd integer number
        up to but not including 10. We get this sequence by calling the function range(1,10,2).
    - body: The last number in the range function specifies how much to increase each successive integer
        in the sequence, if this is omitted then step defaults to 1. Since we want to print only every
        odd integer numbers, we set the step to 2.<br><br>Note that all statements inside the loop need
        to be indented with respect to the loop header.
  - snippet: 'for num in range(10, 11, 2):'
