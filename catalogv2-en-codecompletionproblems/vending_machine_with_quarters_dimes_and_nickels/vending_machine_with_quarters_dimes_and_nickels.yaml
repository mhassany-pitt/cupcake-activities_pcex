title: Vending Machine With Quarters-Dimes- and Nickels
description: Suppose we have a vending machine that gives change. A customer selects an item for purchase
  and inserts a bill into the vending machine. The vending machine dispenses the purchased item and gives
  change. We will assume that all item prices are multiples of 5 cents, and the machine gives all change
  in quarters, dimes, and nickels. Construct a program that computes how many quarters, dimes, and nickels
  to return to the customer.
