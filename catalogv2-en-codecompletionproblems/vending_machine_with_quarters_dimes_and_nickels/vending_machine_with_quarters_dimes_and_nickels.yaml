    role: solution
    explanations:
    - body: To obtain the remaining change due after taking away the dimes, we have to take the remainder
        of the change due divided by pennies per dime. The % operator returns the remainder of the division.
    - body: Note that the number of pennies per dime is stored in the variable pennies_per_dime.
