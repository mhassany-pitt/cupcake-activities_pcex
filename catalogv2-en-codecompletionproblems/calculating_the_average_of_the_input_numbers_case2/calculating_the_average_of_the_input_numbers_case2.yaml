elements:
- type: blank
  location:
    snippet: 'if num % 2 == 0 :'
  choices:
  - snippet: 'if num % 2 == 0 :'
    role: solution
    explanations:
    - body: We want to calculate the average of the even numbers that the user enters. Therefore, we should
        skip numbers that aren't even. To do this, we need an if statement that uses the remainder (%)
        operator to test whether the integer that the user entered is even. The even integer must be divisible
        by 2 i.e. when it is divided by 2, there is a zero remainder.
    - body: The body of this if statement is executed only if the integer is even, that is the remainder
        when the integer is divided by 2 is zero. Note that the % operator returns the remainder of the
        division.
  - snippet: 'if count % 2 == 0 :'
    role: distractor
- type: blank
  location:
    snippet: count += 1
  choices:
  - snippet: count += 1
    role: solution
    explanations:
    - body: We have to count the number of even integers that are entered because we need it for calculating
        the average of even integers. Therefore, each time that the user enters an even integer, we need
        to increment the number of even integers that user has entered by 1. Note that if the user enters
        0, it will not be counted.
    - body: The += operator adds the value on the right-hand side of the assignment operator (i.e., 1)
        to the current value of the variable on the left-hand side (i.e., value of variable count) and
        the result is stored in the variable count. Thus, this statement is equivalent to the statement
        count = count + 1.
  - snippet: count += 2
    role: distractor
- type: blank
  location:
    snippet: total += num
  choices:
  - snippet: total += num
    role: solution
    explanations:
    - body: We need to add the even integer that the user has entered to the running total. So, each time
        that the user enters an even integer, that integer needs to be added to and stored back into total.
    - body: The += operator adds the value on the right-hand side of the assignment operator (i.e., value
        of variable num) to the current value of the variable on the left-hand side (i.e., value of variable
        total) and the result is stored in the variable total. Thus, this statement is equivalent to the
        statement total = total + num.
  - snippet: num = num + 2
    role: distractor
