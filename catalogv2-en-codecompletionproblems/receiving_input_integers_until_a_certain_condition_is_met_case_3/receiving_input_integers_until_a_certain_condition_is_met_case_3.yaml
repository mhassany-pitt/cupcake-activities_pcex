  location:
    snippet: 'while num >= 0 and num <= 1000 :'
  choices:
  - snippet: 'while num >= 0 and num <= 1000 :'
    role: solution
    explanations:
    - body: We need to repeat receiving the integers from the user as long as the user enters an integer
        that not negative and is not greater than 1000. Therefore, we need to use a loop structure. Since
        we don't know ahead of time how many times the loop will be repeated, we need to use a while loop.
        The condition in the while loop tests whether the body of the loop should be repeated, so it should
        test whether the input integer is non-negative and not greater than 1000.<br><br>We could check
        whether the input integer is non-negative by checking whether the input integer is greater than
        or equal to zero. We could check whether the input integer is not greater than 1000 by checking
        whether the input integer is less than or equal to 1000.
    - body: The body of the while loop is repeated as long as the user enters an integer that is not negative
        and is not greater than 1000. The loop terminates when the loop condition evaluates to False,
        that is when the user enters a negative integer or an integer greater than 1000.
    - body: Note that the and operator yields the result True if both conditions are True.
