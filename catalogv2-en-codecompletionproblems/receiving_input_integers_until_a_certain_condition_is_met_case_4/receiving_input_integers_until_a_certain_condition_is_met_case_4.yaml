elements:
- type: blank
  location:
    snippet: 'while num % 2 != 0 or num >= 10 :'
  choices:
  - snippet: 'while num % 2 != 0 or num >= 10 :'
    role: solution
    explanations:
    - body: We need to repeat receiving the integers from the user as long as the user enters an integer
        that is not even or is not less than 10. Therefore, we need to use a loop structure. Since we
        don't know ahead of time how many times the loop will be repeated, we need to use a while loop.
        The condition in the while loop tests whether the body of the loop should be repeated, so it should
        test whether the input integer is not even or not less than 10.<br><br>We check whether the input
        integer is not even by checking whether the remainder when the integer is divided by 2 is not
        zero. We could check whether the input integer is not less than 10 by checking whether the input
        integer is greater than or equal to 10.
    - body: The body of the while loop is repeated as long as the user enters an integer that is not even
        or is not less than 10. The loop terminates when the loop condition evaluates to False, that is
        when the user enters an even integer less than 10.
    - body: Note that the or operator yields the result True if at least one of the conditions is True.
        Also note that the % operator returns the remainder of the division.
  - snippet: 'while num % 2 == 0 and num < 10 :'
    role: distractor
  - snippet: 'while num % 2 != 0 and num >= 10 :'
    role: distractor
  - snippet: 'while num % 2 == 0 or num < 10 :'
    role: distractor
  - snippet: 'while num % 2 != 0 or num > 10 :'
    role: distractor
