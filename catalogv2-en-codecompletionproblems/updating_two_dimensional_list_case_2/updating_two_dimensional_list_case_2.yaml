  activity: code-completion
  difficulty: novice
  prereq_topics: []
  topics: []
runtime:
  language: python
  version: 3
statement: Write a program that initializes a 3x3 two-dimensional matrix that has the numbers 1 through
  9 for entries, updates the middle row to a list filled with 1s, then sets the top-right element of the
  matrix to be 10, and finally prints the matrix.
executions:
- title: Sample Run
  stdin: []
  stdout: '[[1, 2, 10], [1, 1, 1], [7, 8, 9]]'
  console: '[[1, 2, 10], [1, 1, 1], [7, 8, 9]]'
  stderr: ''
  status: pass
elements:
- type: blank
  location:
    snippet: matrix[1] = [1, 1, 1]
  choices:
  - snippet: matrix[1] = [1, 1, 1]
    role: solution
    explanations:
    - body: This statement assigns a list of 1s to the middle row of the matrix.
    - body: In a two-dimensional list, we can get an entire matrix row (a nested sublist) by using one
        index. The row index could start at 0 and continue up to but not including the length of the two-dimensional
        list, i.e., the number of rows in the two-dimensional list matrix.
    - body: In this statement, the list on the right-hand side of the assignment operator is the new list
        that we want to assign to the matrix row. The index of the middle row in the matrix is 1. So,
        matrix[1] corresponds to the middle row in the matrix.
  - snippet: matrix[2] = [1, 1, 1]
    role: distractor
  - snippet: matrix[0] = [1, 1, 1]
    role: distractor
- type: blank
  location:
    snippet: matrix[0][2] = 10
  choices:
  - snippet: matrix[0][2] = 10
    role: solution
    explanations:
    - body: This statement sets the top-right element of the matrix to be 10.
    - body: In a two-dimensional list, we can access an element within a matrix row (a nested sublist)
        by using two indices. The first index in [] is the row index and the second index in [] is the
        column index. The row index could start at 0 and continue up to but not including the length of
        the two-dimensional list, i.e., the number of rows in the two-dimensional list. The column index
        could start at 0 and continue up to but not including the length of the row, i.e., the number
        of elements within the row.
    - body: The top-right element of the matrix has the row index of 0 and the column index of 2. So,
        matrix[0][2] corresponds to the top-right element of the matrix.
  - snippet: matrix[0][3] = 10
    role: distractor
  - snippet: matrix[1][3] = 10
    role: distractor
  - snippet: matrix[2][0] = 10
    role: distractor
  - snippet: matrix[3][3] = 10
    role: distractor
