id: cc_py_list2d_basic_1
title: Updating Two-Dimensional List (Case 2)
description: Construct a program that initializes a 3x3 two-dimensional matrix that has the numbers 1
  through 9 for entries, updates the middle row to a list filled with 1s, then sets the top-right element
  of the matrix to be 10, and finally prints the matrix.
