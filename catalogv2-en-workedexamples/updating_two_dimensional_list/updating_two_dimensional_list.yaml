id: we_py_list2d_basic_0
title: Updating Two-Dimensional List
description: Construct a program that initializes a 3x4 two-dimensional matrix that has the numbers 1
  through 12 for entries, updates the last row to a list filled with 5s, then sets the left-most element
  in the middle row of the matrix to be 20, and finally prints the matrix.
authors:
