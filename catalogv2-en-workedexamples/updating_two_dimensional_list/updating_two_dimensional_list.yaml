  activity: worked-example
  difficulty: novice
  prereq_topics: []
  topics: []
runtime:
  language: python
  version: 3
statement: Write a program that initializes a 3x4 two-dimensional matrix that has the numbers 1 through
  12 for entries, updates the last row to a list filled with 5s, then sets the left-most element in the
  middle row of the matrix to be 20, and finally prints the matrix.
executions:
- title: Sample Run
  stdin: []
  stdout: '[[1, 2, 3, 4], [20, 6, 7, 8], [5, 5, 5, 5]]'
  console: '[[1, 2, 3, 4], [20, 6, 7, 8], [5, 5, 5, 5]]'
  stderr: ''
  status: pass
elements:
- type: explanation
  location:
    snippet: matrix = [[ 1, 2, 3, 4 ],
  explanations:
  - body: We need to use two-dimensional list (a list of lists) to create a matrix. Each matrix row corresponds
      to a sublist in the two-dimensional list. This statement creates a 3x4 two-dimensional list called
      matrix and initializes its entries with numbers 1 through 12.
  - body: Note that lists can naturally span multiple lines if we want them to because they are contained
      by a pair of brackets.
- type: explanation
  location:
    snippet: matrix[2] = [5, 5, 5, 5]
  explanations:
  - body: This statement assigns a list of 5s to the last row of the matrix.
  - body: In a two-dimensional list, we can get an entire matrix row (a nested sublist) by using one index.
      The row index could start at 0 and continue up to but not including the length of the two-dimensional
      list, i.e., the number of rows in the two-dimensional list.
  - body: In this statement, the list on the right-hand side of the assignment operator is the new list
      that we want to assign to the matrix row. The index of the last row in the matrix is 2. So, matrix[2]
      corresponds to the last row in the matrix.
- type: explanation
  location:
    snippet: matrix[1][0] = 20
  explanations:
  - body: This statement sets the left-most element in the middle row of the matrix to be 20.
  - body: In a two-dimensional list, we can access an element within a matrix row (a nested sublist) by
      using two indices. The first index in [] is the row index and the second index in [] is the column
      index. The row index could start at 0 and continue up to but not including the length of the two-dimensional
      list, i.e., the number of rows in the two-dimensional list. The column index could start at 0 and
      continue up to but not including the length of the row, i.e., the number of elements within the
      row.
  - body: The left-most element of a row has the column index of 0. We want to update the element in the
      middle row of the matrix, so we should use the row index of 1. So, matrix[1][0] corresponds to the
      left-most element in the middle row of the matrix.
- type: explanation
  location:
    snippet: print(matrix)
  explanations:
  - body: We can see the content of the two-dimensional list by calling the print function and passing
      the two-dimensional list to that. This statement will print the entire matrix followed by the end-of-line
      character.
