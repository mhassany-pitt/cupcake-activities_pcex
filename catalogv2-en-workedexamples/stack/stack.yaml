elements:
- type: explanation
  location:
    snippet: 'class Stack:'
  explanations:
  - body: We define the class named Stack to represent a Stack structure.
- type: explanation
  location:
    snippet: 'def __init__(self):'
  explanations:
  - body: We want to initialize the Stack. We do this by defining an __init__ method, which is run automatically
      by Python each time an instance is created. The argument (named self) is passed in automatically
      by the interpreter when the method is invoked on an instance of the class.
  - body: Note that Python automatically fills the first argument in with the instance object that is
      the implied subject of the method call. Therefore, when this method is invoked on an instance of
      the class, no parameter must be passed to the method.
- type: explanation
  location:
    snippet: self.items = []
  explanations:
  - body: This statement initiates an empty list. self is the instance of the class and self.items created
      an empty list.
- type: explanation
  location:
    snippet: 'def is_empty(self):'
  explanations:
  - body: This method checks If the list is empty. The argument (named self) is passed in automatically
      by the interpreter when the method is invoked on an instance of the class.
  - body: Note that Python automatically fills the first argument in with the instance object that is
      the implied subject of the method call. Therefore, when this method is invoked on an instance of
      the class, no parameter must be passed to the method.
- type: explanation
  location:
    snippet: return len(self.items) == 0
  explanations:
  - body: This statement checks if the list is empty. It uses the built-in function len() to evaluate
      if there are any elements in the list and will return a Boolean value. If there are elements in
      the list, it will return False. If the list is empty, it will return True.
  - body: Note that the function len(lst) returns the number of the values in the list.
- type: explanation
  location:
    snippet: 'def push(self, item):'
  explanations:
  - body: This method adds a new element to the list (item) that is specified as the method's parameter.
      The first argument (named self) is passed in automatically by the interpreter when the method is
      invoked on an instance of the class.
  - body: Note that Python automatically fills the first argument in with the instance object that is
      the implied subject of the method call. Therefore, when this method is invoked on an instance of
      the class, only the last parameter (item) must be passed to the method.
- type: explanation
  location:
    snippet: self.items.append(item)
  explanations:
  - body: This statement uses the built-in function append() to add the last parameter (item) to the initialized
      list.
- type: explanation
  location:
    snippet: 'def pop(self):'
  explanations:
  - body: This method pops the last element out of the list. The argument (named self) is passed in automatically
      by the interpreter when the method is invoked on an instance of the class.
  - body: Note that Python automatically fills the first argument in with the instance object that is
      the implied subject of the method call. Therefore, when this method is invoked on an instance of
      the class, no parameter must be passed to the method.
- type: explanation
  location:
    snippet: return self.items.pop()
  explanations:
  - body: This statement returns the popped-out element by using the built-in function pop(). By default,
      pop() function pops the last element in the list.
- type: explanation
  location:
    snippet: 'def peek(self):'
  explanations:
  - body: This method checks the last element in the list. The argument (named self) is passed in automatically
      by the interpreter when the method is invoked on an instance of the class.
  - body: Note that Python automatically fills the first argument in with the instance object that is
      the implied subject of the method call. Therefore, when this method is invoked on an instance of
      the class, no parameter must be passed to the method.
- type: explanation
  location:
    snippet: 'if not self.is_empty():'
  explanations:
  - body: We need to perform a test to check whether the list is empty, before accessing the last element
      in the list.
  - body: The if not statement tests whether the list is empty by calling is_empty() function that returns
      a Boolean value. If not false yields a True, then the body of this if statement gets executed. Otherwise,
      if not true, the body of this if not statement is skipped.
- type: explanation
  location:
    snippet: return self.items[len(self.items) - 1]
  explanations:
  - body: This statement returns the last elements of the list by using the built-in function len().
  - body: Note that the function len(lst) returns the number of the values in the list.
- type: explanation
  location:
    snippet: 'def size(self):'
  explanations:
  - body: This method checks the size of the list. The argument (named self) is passed in automatically
      by the interpreter when the method is invoked on an instance of the class.
  - body: Note that Python automatically fills the first argument in with the instance object that is
      the implied subject of the method call. Therefore, when this method is invoked on an instance of
      the class, no parameter must be passed to the method.
- type: explanation
  location:
    snippet: return len(self.items)
  explanations:
  - body: This statement returns the size of the list by using the built-in function len().
  - body: Note that the function len(lst) returns the number of the values in the list.
- type: explanation
  location:
    snippet: s=Stack()
  explanations:
  - body: We create an instance of the class Stack to demonstrate the creation and use of Stack instances.
  - body: This statement creates a Stack instance. The variable s holds a reference to a Stack instance.
- type: explanation
  location:
    snippet: print(s.is_empty())
    nth: 1
  explanations:
  - body: This statement checks if the current list is empty. To test if the current list is empty, we
      invoke the method is_empty() of s. Note that we do not necessarily have to store the returned value
      of this method in a variable. We could use the returned value directly in the print statement.
- type: explanation
  location:
    snippet: s.push(4)
  explanations:
  - body: This statement invokes the method push() of s to pass the parameter 4 and add it to the list.
      Note that s is the implied subject (instance) passed to self.
- type: explanation
  location:
    snippet: s.push('dog')
  explanations:
  - body: This statement invokes the method push() of s to pass the parameter ‘dog’ and add it to the
      list. Note that s is the implied subject (instance) passed to self.
- type: explanation
  location:
    snippet: print(s.peek())
  explanations:
  - body: This statement prints the current last element of the list. To get the last element, we invoke
      the method peek() of s. Note that we do not necessarily have to store the returned value of this
      method in a variable. We could use the returned value directly in the print statement.
- type: explanation
  location:
    snippet: s.push(True)
  explanations:
  - body: This statement invokes the method push() of s to pass the parameter True and add it to the list.
      Note that s is the implied subject (instance) passed to self.
- type: explanation
  location:
    snippet: print(s.size())
    nth: 1
  explanations:
  - body: This statement prints the current size of the list. To get the current list size, we invoke
      the method size() of s. Note that we do not necessarily have to store the returned value of this
      method in a variable. We could use the returned value directly in the print statement.
- type: explanation
  location:
    snippet: print(s.is_empty())
    nth: 2
  explanations:
  - body: This statement checks if the current list is empty. To test if the current list is empty, we
      invoke the method is_empty() of s. Note that we do not necessarily have to store the returned value
      of this method in a variable. We could use the returned value directly in the print statement.
- type: explanation
  location:
    snippet: s.push(8.4)
  explanations:
  - body: This statement invokes the method push() of s to pass the parameter 8.4 and add it to the list.
      Note that s is the implied subject (instance) passed to self.
- type: explanation
  location:
    snippet: print(s.pop())
    nth: 1
  explanations:
  - body: This statement checks the first popped element of the list. To get the popped element in the
      list, we invoke the method pop() of s. Note that we do not necessarily have to store the returned
