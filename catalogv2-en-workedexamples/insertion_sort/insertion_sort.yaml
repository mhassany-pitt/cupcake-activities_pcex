elements:
- type: explanation
  location:
    snippet: 'def insertion_sort(data):'
  explanations:
  - body: We want to define our function to take in a single parameter -- the list we’d like to sort.
- type: explanation
  location:
    snippet: 'for i in range(1, len(data)):'
  explanations:
  - body: The outer loop of insertion sort traverses through the entire list, starting at index 1 (the
      second element). This is because we want to later create a variable (j) that is always equal to
      i-1, so we start the outer loop at i=1 to keep j greater than or equal to zero.
- type: explanation
  location:
    snippet: current = data[i]
  explanations:
  - body: We initialize the variable current equal to the value at index i of the array.
- type: explanation
  location:
    snippet: j = i-1
  explanations:
  - body: Insertion sort works by comparing the current value to its predecessor, and then (if the current
      value is smaller than its predecessor) comparing the current element to the elements before the
      predecessor. Therefore, we want a variable to start at i-1 -- the predecessor to the current element.
- type: explanation
  location:
    snippet: 'while j>=0 and current < data[j]:'
  explanations:
  - body: The outer loop iterates through the list sequentially, whereas the inner while loop will iterate
      through the list backwards if the current element is smaller than its predecessor. We want the algorithm
      to keep comparing current to smaller and smaller elements of the list until it finds the index it
      should be at, so we initialize the while loop condition to run until either there are no more elements
      to traverse backwards through, or we find the right place for current to reside in the array
- type: explanation
  location:
    snippet: data[j+1] = data[j]
  explanations:
  - body: If current is smaller than its predecessor, we want to swap their positions. However, we don’t
      want to swap current just yet, because we might end up needing to make more swaps afterwards if
      current still isn’t in the right place. It’s easier to keep track of current’s initial position
      by instead swapping array elements directly, keeping current in reserve assigned to the current
      element of the list (that is, the current element before any swaps happened).
- type: explanation
  location:
    snippet: j -=1
  explanations:
  - body: Since we’re traversing backwards, we need to decrement j.
- type: explanation
  location:
    snippet: data[j+1] = current
  explanations:
  - body: 'When the while loop has finished, we know the proper position of current: index j+1 (and not
      j, since j decrements after each iteration of the while loop -- if we were to specify that current
      should go at index j after the loop finishes, current would be one index too far to the left in
      the array).'
- type: explanation
  location:
    snippet: return data
  explanations:
  - body: Once the outer loop has finished, the array is sorted and we can return it to the caller.
- type: explanation
  location:
    snippet: num_list = [30, -20, 25, 0, 2, 5]
  explanations:
  - body: We initialize the list.
- type: explanation
  location:
    snippet: print(insertion_sort(num_list))
  explanations:
  - body: We call ins_sort() on the list we initialized. Because we want to print the list after it’s
      been sorted, we enclose the function call in a print statement.
