  explanations:
  - body: This line checks if the salary of the current employee is greater than 30,000.
  - body: The condition inside the 'if' statement evaluates to either True or False, determining whether
      the subsequent block of code (Line 15) will execute.
  - body: The syntax 'employee["salary"]' accesses the 'salary' key from the current employee dictionary.
      The use of double quotes inside the square brackets is necessary because the key is a string.
  - body: This is a common way to access values in a dictionary in Python.
