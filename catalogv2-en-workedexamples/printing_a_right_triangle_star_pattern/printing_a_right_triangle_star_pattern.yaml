  activity: worked-example
  difficulty: novice
  prereq_topics: []
  topics: []
runtime:
  language: python
  version: 3
statement: |-
  A Right triangle star pattern contains N asterisks in N-th row. Write a program that receives the number of rows in the right triangle star pattern and prints that triangle. For example, when the number of rows in the right triangle star pattern is 5, the program prints the following output:
  *
  **
  ***
  ****
  *****
executions:
- title: Sample Run
  stdin:
  - '5'
  stdout: "Enter the number of rows in the right triangle star pattern: \n*\n**\n***\n****\n*****"
  console: "Enter the number of rows in the right triangle star pattern: \n*\n**\n***\n****\n*****"
  stderr: ''
  status: pass
elements:
- type: explanation
  location:
    snippet: 'N = int(input("Enter the number of rows in the right triangle star pattern: "))'
  explanations:
  - body: 'We need to read and process the number of rows that the user enters. To read the user input
      from command line, we use the input() function. This statement prints a text on the screen "Enter
      the the number of rows in the right triangle star pattern: ", then reads the text entered by the
      user.<br><br>The value that will be read is a string and we need to convert it to an integer. We
      convert the input string to its integer representation by using the int() function.'
  - body: The conversion of the value from string to int can only be done if the string actually presents
      an integer. Also note that we do not necessarily have to store the returned value from the input
      function in a variable. We could use the input function call directly as the int function parameter.
- type: explanation
  location:
    snippet: 'for i in range(1, N+1):'
  explanations:
  - body: The 1st row contains 1 asterisk, 2nd row contains 2 asterisks. In general, the i-th row contains
      i asterisks. We can print this star pattern by using two for loops. The outer for loop will print
      one row in every iteration whereas the inner for loop will print i asterisks for the i-th row.<br><br>This
      statement is the outer for loop. We use the range function because it generates a sequence of numbers
      for the for loop. Here, we want the loop to iterate through 1 to N; therefore, we need a sequence
      that starts at 1 with every integer number up to but not including N+1. We get this sequence by
      calling the function range(1,N+1).
  - body: Note that all statements inside the loop need to be indented with respect to the loop header.
- type: explanation
  location:
    snippet: row = ""
  explanations:
  - body: We need variable row to create the string that represents the i-th row of the star pattern.
      We need to clear the content of the string before we start generating the asterisks in each row
      in the star pattern.
  - body: Note that this statement cannot be placed inside the inner loop because in that case in every
      iteration of the inner loop variable row is set to an empty string and that means that the row content
      for all of rows would contain one asterisk.<br><br>We cannot place this statement outside the outer
      loop either because in that case the asterisks would be accumulated across rows. Therefore, the
      only place that we could place this statement is in the outer loop body before reaching to the inner
      loop.
- type: explanation
  location:
    snippet: 'for j in range(1, i+1):'
  explanations:
  - body: This statement is the inner for loop. Each iteration of inner loop will concatenate the string
      value stored in variable row with one asterisk (*). For the i-th row of the right triangle star
      pattern, the inner loop will iterate i times; thus, creating a row with i asterisks.<br><br>For
      the inner loop, we use the range function because it generates a sequence of numbers for the for
      loop. Here, we want to repeat the loop i times; therefore, we need a sequence that starts at 1 with
      every integer number up to but not including i+1. We get this sequence by calling the function range(1,
      i+1).
  - body: Note that the name that we choose for the loop variable in the inner loop should be different
      from the outer for loop. Here, i is the loop variable in the outer loop and j is the loop variable
      in the inner loop. Also, note that the inner for loop need to be indented with respect to the outer
      for loop.
- type: explanation
  location:
    snippet: row = row + "*"
  explanations:
  - body: This statement concatenates the string in variable row with an asterisk, creating a larger string.
      The resulting string will be stored in variable row.
  - body: Note that we can concatenate the content of the variables that hold string values using the
      + operator.
- type: explanation
  location:
    snippet: print(row)
  explanations:
  - body: This statement prints the asterisks in the i-th row of the right triangle star pattern. The
      printed text is followed by the end-of-line character at the end.
