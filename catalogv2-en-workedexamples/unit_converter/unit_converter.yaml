$schema: https://learning-contents.org/schemas/worked-example/0.1.0
source: main.py
license: MIT
locale: en
id: we_py_f_to_c_conversion_0
title: Unit Converter
description: Construct a program that computes the Fahrenheit equivalent of an input Celsius value using
  the formula F = (9/5)C + 32. The input Celsius value is an integer.
authors:
- first: Roya
  last: Hosseini
  email: moh70@pitt.edu
  affiliation: University of Pittsburgh
pedagogy:
  activity: worked-example
  difficulty: novice
  prereq_topics: []
  topics: []
runtime:
  language: python
  version: 3
statement: Write a program that computes the Fahrenheit equivalent of an input Celsius value using the
  formula F = (9/5)C + 32. The input Celsius value is an integer.
executions:
- title: Sample Run
  stdin:
  - '34'
  stdout: "Enter the Celsius value: \nCelsius Temperature: 34\nFahrenheit Equivalent: 93.2"
  console: "Enter the Celsius value: \nCelsius Temperature: 34\nFahrenheit Equivalent: 93.2"
  stderr: ''
  status: pass
elements:
- type: explanation
  location:
    snippet: base = 32
  explanations:
  - body: We need variable base to store the constant in the conversion formula. We set it to 32.
- type: explanation
  location:
    snippet: conversion_factor = 9 / 5
  explanations:
  - body: We need variable conversion_factor to store the conversion factor in the formula. We set it
      to 9/5.
- type: explanation
  location:
    snippet: 'text = input("Enter the Celsius value: ")'
  explanations:
  - body: We need to read and process the input value that the user enters. To read the input value from
      the user, we need to use the input() function. This statement prompts the user to enter the Celsius
      value, then reads the text entered by the user and places it in the variable text. The value that
      will be stored in variable text is a string.
- type: explanation
  location:
    snippet: celsius_temp = int(text)
  explanations:
  - body: We need to convert the input text to its integer representation. For this purpose, we use the
      conversion function int().
  - body: Note that the conversion to integer can only be done if the string actually presents a number.
      If the input number is a float, the int() function cuts off the fractional part of the floating-point
      number to create an integer.
- type: explanation
  location:
    snippet: fahrenheit_temp = celsius_temp * conversion_factor + base
  explanations:
  - body: To get a Fahrenheit equivalent of a Celsius value, we multiply the Celsius value by 9/5 and
      add 32 to that. Note that the precedence rules dictate that the multiplication happens before the
      addition in the final conversion computation. Therefore, we don't need to enclose the multiplication
      operator and its operands in parentheses.
- type: explanation
  location:
    snippet: print("Celsius Temperature:" , celsius_temp)
  explanations:
  - body: This statement prints to the default standard output stream the text "Celsius Temperature:"
      and the value of variable celsius_temp.<br>The printed text shows the arguments of the print function
      separated by the default delimiter (i.e., single space character) and followed by the end-of-line
      character at the end.
- type: explanation
  location:
    snippet: print("Fahrenheit Equivalent:" , fahrenheit_temp)
  explanations:
  - body: This statement prints to the default standard output stream the text "Fahrenheit Equivalent:"
      and the value of variable fahrenheit_temp.<br>The printed text shows the arguments of the print
      function separated by the default delimiter (i.e., single space character) and followed by the end-of-line
      character at the end.
