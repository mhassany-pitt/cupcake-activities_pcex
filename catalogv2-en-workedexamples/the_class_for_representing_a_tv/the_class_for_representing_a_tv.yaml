  - body: Note that Python automatically fills the first argument in with the instance object that is
      the implied subject of the method call. Therefore, when this method is invoked on an instance of
      the class, no parameter must be passed to the method.
- type: explanation
  location:
    snippet: return self.__on
  explanations:
  - body: This statement returns whether the TV is on/off.<br>self is the instance of the class and self.__on
      shows whether the TV is on. We start the attribute name by two underscore (self.__on) to prevent
      accessing the attribute directly from outside of the class.
- type: explanation
  location:
    snippet: tv1 = TV1()
  explanations:
  - body: We create an instance of the class TV1 to demonstrate the creation and use of TV1 instances
  - body: This statement creates a TV1 instance. The variable tv1 holds a reference to a TV1 instance.
