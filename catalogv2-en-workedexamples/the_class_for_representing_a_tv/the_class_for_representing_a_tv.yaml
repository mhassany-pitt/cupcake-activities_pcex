- type: explanation
  location:
    snippet: print("tv1's channel is " + str(tv1.get_channel()))
  explanations:
  - body: This statement concatenates the content of the given strings and variables to print the current
      channel of tv1. To get the current channel of tv1, we invoke the method get_channel of tv1. Note
      that we do not necessarily have to store the returned value of this method in a variable. We could
      use the returned value directly in the print statement.
  - body: Note that We concatenate the current channel of tv1 with the given string using the + operator.
      The channel is a number and can be concatenated with strings only when it is explicitly converted
      to a string using the str function.
  - body: Note that the concatenating and printing are done in the same line. That is, we don't have to
      store the concatenated string to a new variable at first and then print it in the next line.
  - body: Note that the + operator creates a new string from the contents of its operands joined. This
      string will be printed by the print function and followed by the end-of-line character at the end.
