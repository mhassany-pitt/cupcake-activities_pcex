elements:
- type: explanation
  location:
    snippet: 'class TV1 :'
  explanations:
  - body: We define the class named TV1 to represent a TV.
- type: explanation
  location:
    snippet: 'def __init__(self):'
  explanations:
  - body: We want to initialize the attributes of the TV when we create an instance of the TV1 class.
      We do this by defining an __init__ method, which is run automatically by Python each time an instance
      is created. The argument (named self) is passed in automatically by the interpreter when the method
      is invoked on an instance of the class.
  - body: Note that Python automatically fills the first argument in with the instance object that is
      the implied subject of the method call. Therefore, when this method is invoked on an instance of
      the class, no parameter must be passed to the method.
- type: explanation
  location:
    snippet: self.__on = False
    nth: 1
  explanations:
  - body: This statement sets the on/off state of the TV to False because, by default, the TV is off.<br>self
      is the instance of the class and self.__on shows whether the TV is on. The self.__on is True when
      the TV is on, and False otherwise. We start the attribute name by two underscore (self.__on) to
      prevent accessing the attribute directly from outside of the class.
- type: explanation
  location:
    snippet: self.__channel = 1
  explanations:
  - body: This statement sets the TV channel to 1 because, we assume that the default channel of the TV
      is 1.<br>self is the instance of the class and self.__channel shows the current TV channel. We start
      the attribute name by two underscore (self.__channel) to prevent accessing the attribute directly
      from outside of the class.
- type: explanation
  location:
    snippet: 'def turn_on(self) :'
  explanations:
  - body: This method turns on the TV. The argument (named self) is passed in automatically by the interpreter
      when the method is invoked on an instance of the class.
  - body: Note that Python automatically fills the first argument in with the instance object that is
      the implied subject of the method call. Therefore, when this method is invoked on an instance of
      the class, no parameter must be passed to the method.
- type: explanation
  location:
    snippet: self.__on = True
  explanations:
  - body: This statement sets the on/off state of the TV to True to turn on the TV.<br>self is the instance
      of the class and self.__on shows whether the TV is on. We start the attribute name by two underscore
      (self.__on) to prevent accessing the attribute directly from outside of the class.
- type: explanation
  location:
    snippet: 'def turn_off(self) :'
  explanations:
  - body: This method turns off the TV. The argument (named self) is passed in automatically by the interpreter
      when the method is invoked on an instance of the class.
  - body: Note that Python automatically fills the first argument in with the instance object that is
      the implied subject of the method call. Therefore, when this method is invoked on an instance of
      the class, no parameter must be passed to the method.
- type: explanation
  location:
    snippet: self.__on = False
    nth: 2
  explanations:
  - body: This statement sets the on/off state of the TV to False to turn off the TV.<br>self is the instance
      of the class and self.__on shows whether the TV is on. We start the attribute name by two underscore
      (self.__on) to prevent accessing the attribute directly from outside of the class.
- type: explanation
  location:
    snippet: 'def set_channel(self, new_channel) :'
  explanations:
  - body: This method sets the current channel of the TV to a channel (new_channel) that is specified
      as the method's parameter. The first argument (named self) is passed in automatically by the interpreter
      when the method is invoked on an instance of the class.
  - body: Note that Python automatically fills the first argument in with the instance object that is
      the implied subject of the method call. Therefore, when this method is invoked on an instance of
      the class, only the last parameter (new_channel) must be passed to the method.
- type: explanation
  location:
    snippet: 'if self.__on and new_channel >= 1 and new_channel <= 120 :'
  explanations:
  - body: We need to perform a test to check whether the conditions for setting the current channel of
      the TV to the given channel exist. The current channel of the TV could be set to the given channel
      only when the TV is on and the given channel is within the valid channel range. A valid range for
      the TV channel is from 1 to 120 (both inclusive).
  - body: The if statement tests whether the TV is on and the given channel is greater than or equal to
      1 and less than or equal to 120. If the TV is on and the given channel is greater than or equal
      to 1 and less than or equal to 120, then the body of this if statement gets executed. Otherwise,
      the body of this if statement is skipped.
  - body: Note that the and operator yields the result True if both conditions are True.
- type: explanation
  location:
    snippet: self.__channel = new_channel
  explanations:
  - body: This statement sets the current TV channel to the given value (new_channel).<br>self is the
      instance of the class and self.__channel shows the current TV channel. We start the attribute name
      by two underscore (self.__channel) to prevent accessing the attribute directly from outside of the
      class.
- type: explanation
  location:
    snippet: 'def channel_up(self) :'
  explanations:
  - body: This method increases the current channel number of the TV by 1. The argument (named self) is
      passed in automatically by the interpreter when the method is invoked on an instance of the class.<br><br>This
      method does not have any parameters because the only data that we need to use in this method are
      the instance attributes of the class (the TV on/off state and the current channel of the TV) and
      we can directly access the instance attributes from the methods that are inside the class.
  - body: Note that Python automatically fills the first argument in with the instance object that is
      the implied subject of the method call. Therefore, when this method is invoked on an instance of
      the class, no parameter must be passed to the method.
- type: explanation
  location:
    snippet: 'if self.__on and self.__channel < 120 :'
  explanations:
  - body: We need to perform a test to check whether the conditions for increasing the current channel
      number by 1 exist. The current channel of the TV could be increased by 1 only when the TV is on
      and the current channel is less than 120.
  - body: The if statement tests whether the TV is on and the current channel is less than 120. If the
      TV is on and the current channel is less than 120, then the body of this if statement gets executed.
      Otherwise, the body of this if statement is skipped.
  - body: Note that the and operator yields the result True if both conditions are True.
- type: explanation
  location:
    snippet: self.__channel += 1
  explanations:
  - body: This statement increases the current channel number of the TV by 1.<br>self is the instance
      of the class and self.__channel shows the current TV channel. We start the attribute name by two
      underscore (self.__channel) to prevent accessing the attribute directly from outside of the class.
  - body: The increment operator (+=) adds 1 to the value of instance attribute self.__channel and the
      result is stored back into the instance attribute self.__channel. Therefore, it is functionally
      equivalent to the statement self.__channel = self.__channel + 1.
- type: explanation
  location:
    snippet: 'def channel_down(self) :'
  explanations:
  - body: This method decrease the current channel number of the TV by 1. The argument (named self) is
      passed in automatically by the interpreter when the method is invoked on an instance of the class.<br><br>This
      method does not have any parameters because the only data that we need to use in this method are
      the instance attributes of the class (the TV on/off state and the current channel of the TV) and
      we can directly access the instance attributes from the methods that are inside the class.
  - body: Note that Python automatically fills the first argument in with the instance object that is
      the implied subject of the method call. Therefore, when this method is invoked on an instance of
      the class, no parameter must be passed to the method.
- type: explanation
  location:
    snippet: 'if self.__on and self.__channel > 1 :'
  explanations:
  - body: We need to perform a test to check whether the conditions for decreasing the current channel
      number by 1 exist. The channel of the TV could be decreased by 1 only when the TV is on and the
      current channel is greater than 1.
  - body: The if statement tests whether the TV is on and the current channel is greater than 1. If the
      TV is on and the current channel is greater than 1, then the body of this if statement gets executed.
      Otherwise, the body of this if statement is skipped.
  - body: Note that the and operator yields the result True if both conditions are True.
- type: explanation
  location:
    snippet: self.__channel -= 1
  explanations:
  - body: This statement decreases the channel number of the TV by 1.<br>self is the instance of the class
      and self.__channel shows the current TV channel. We start the attribute name by two underscore (self.__channel)
      to prevent accessing the attribute directly from outside of the class.
  - body: The decrement operator (-=) subtracts 1 from the value of instance attribute self.__channel
      and the result is stored back into the instance attribute self.__channel. Therefore, it is functionally
      equivalent to the statement self.__channel = self.__channel - 1.
- type: explanation
  location:
    snippet: 'def get_channel(self) :'
  explanations:
  - body: This method returns the current channel of the TV. The argument (named self) is passed in automatically
      by the interpreter when the method is invoked on an instance of the class.
  - body: Note that Python automatically fills the first argument in with the instance object that is
      the implied subject of the method call. Therefore, when this method is invoked on an instance of
      the class, no parameter must be passed to the method.
- type: explanation
  location:
    snippet: return self.__channel
  explanations:
  - body: This statement returns the current channel of the TV.<br>self is the instance of the class and
      self.__channel is the current channel of the instance. We start the attribute name by two underscore
      (self.__channel) to prevent accessing the attribute directly from outside of the class.
- type: explanation
  location:
    snippet: 'def is_on(self) :'
  explanations:
  - body: This method returns whether the TV is on/off. The argument (named self) is passed in automatically
