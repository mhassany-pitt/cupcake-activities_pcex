id: we_py_concat_char_two_str_0
title: Concatenating Characters of Two Strings
description: |-
  Construct a program that has a function that receives two strings and returns a string formed from the given strings such that the first character of each string is omitted.
  For example, the new string that will be formed from the strings 'abc' and 'xyz' is 'bcyz'.
  Assume that both strings have at least one character.
