elements:
- type: explanation
  location:
    snippet: 'def concat_chars(a, b):'
  explanations:
  - body: We need to first declare the function so that we can call it later. The following lines declare
      the function concat_chars that receives two strings and returns a string formed from the given strings
      such that the first character of each string is omitted. The 1st string is referred by variable
      a and the 2nd string is referred by variable b.<br><br>Note that all statements following the header
      line are indented.
- type: explanation
  location:
    snippet: return a[1:] + b[1:]
  explanations:
  - body: This statements returns the result of the concatenation of the string values stored in variables
      a and b without including their first characters.<br><br>a[1:] and b[1:] fetch all characters beyond
      the first character in the 1st and 2nd string, respectively.<br><br>In both a[1:] and b[1:] the
      upper bound, which is not specified, defaults to the length of the string.
  - body: Note that we can get ranges of characters in a string by slicing, that is by providing a pair
      of offsets separated by a colon in square brackets after the string (e.g., s[1:3]). The left offset
      is taken to be the lower bound (inclusive), and the right is the upper bound (non-inclusive). That
      is, Python fetches all characters from the lower bound up to but not including the upper bound.
      If omitted, the left bound defaults to 0 and the right bound defaults to the length of the string
      that we are slicing.
  - body: The return statement, when reached, ends the function call and sends the result back to the
      caller.
- type: explanation
  location:
    snippet: print(concat_chars("Hello", "There"))
  explanations:
  - body: This statement prints to the default standard output stream the string returned from the function
      call. Note that we do not necessarily have to store the returned string from the function call in
      a variable. We could use the string returned from the function call directly in the print function.
  - body: Note that the function call must be done after the function is declared.
