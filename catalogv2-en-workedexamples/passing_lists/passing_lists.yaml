elements:
- type: explanation
  location:
    snippet: 'def square(list):'
  explanations:
  - body: We need to first declare the function so that we can call it later. The following lines declare
      the function square that takes a list and square each element.
  - body: Note that all statements following the header line are indented.
- type: explanation
  location:
    snippet: 'for i in range(len(list)):'
  explanations:
  - body: We want to iterate over the list and access each element by using index.
- type: explanation
  location:
    snippet: list[i] *= list[i]
  explanations:
  - body: This statement converts each element to its squared value.
- type: explanation
  location:
    snippet: print(list)
  explanations:
  - body: This statement prints the list after converting all the original values to squared values.
- type: explanation
  location:
    snippet: num_list = [2,3,4,5]
  explanations:
  - body: This statement initiates the original list
- type: explanation
  location:
    snippet: square(num_list)
  explanations:
  - body: This statement calls the square function and pass the list num_list as its argument.
  - body: Note that the function call must be done after the function is declared.
- type: explanation
  location:
    snippet: print(num_list)
  explanations:
  - body: This statement prints the list num_list.
  - body: 'The list has two characteristics: subscriptability and mutability. Subscriptability indicates
      that a list can be accessed by index positions; mutability indicates that a list structure can be
      changed in place rather than requiring reassignment. When passing a list and access it by its index,
      we are also changing its original values'
