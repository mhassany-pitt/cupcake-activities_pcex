elements:
- type: explanation
  location:
    snippet: text = input("Enter the weight in pounds:")
  explanations:
  - body: We need to read and process the input value that the user enters. To read the input value from
      the user, we need to use the input() function. This statement prompts the user to enter the weight
      in pounds, then reads the text entered by the user and places it in the variable text. The value
      that will be stored in variable text is a string.
- type: explanation
  location:
    snippet: weight = float(text)
  explanations:
  - body: We need to convert the input text to its float representation because weight could have a decimal
      point. For this purpose, we use the conversion function float().
  - body: Note that this can only be done if user input could be translated into a valid floating-point
      value.
- type: explanation
  location:
    snippet: text = input("Enter the height in inches:")
  explanations:
  - body: We need to read and process the input value that the user enters. To read the input value from
      the user, we need to use the input() function. This statement prompts the user to enter height in
      inches, then reads the text entered by the user and places it in the variable text. The value that
      will be stored in variable text is a string.
- type: explanation
  location:
    snippet: height = float(text)
  explanations:
  - body: We need to convert the input text to its float representation because height could have a decimal
      point. For this purpose, we use the conversion function float().
  - body: Note that this can only be done if user input could be translated into a valid floating-point
      value.
- type: explanation
  location:
    snippet: bmi = weight / height ** 2 * 703
  explanations:
  - body: We calculate the BMI using the mathematical expression in this statement.
  - body: The height ** 2 returns the value of height raised to the power of the 2. Note that the ** operator
      is the exponent operator.
  - body: Note that the exponent (**) has the highest precedence level so it's the first operation that
      is performed. Also, multiplication (*) and division operator (/) are in the same precedence level,
      and thus, are evaluated from left to right in this expression. Therefore, we don't need to enclose
      the division operator and its operands in parentheses.
- type: explanation
  location:
    snippet: print("The BMI is:", bmi)
  explanations:
  - body: This statement prints to the default standard output stream the text "The BMI is:" and the value
      of variable bmi.<br>The printed text shows the arguments of the print function separated by the
      default delimiter (i.e., single space character) and followed by the end-of-line character at the
      end.
