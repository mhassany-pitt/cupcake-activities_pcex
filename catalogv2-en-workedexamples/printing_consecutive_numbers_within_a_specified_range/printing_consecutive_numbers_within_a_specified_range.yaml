elements:
- type: explanation
  location:
    snippet: 'for num in range(1, 10):'
  explanations:
  - body: We need to repeat printing the numbers that are in a sequence from 1 (inclusive) to 9 (inclusive).
      To do this, we need to use a loop structure. We use for loops instead of a while loop because we
      need to repeat the loop 9 times, and for loops are best-suited in cases like this when we know ahead
      of time the number of times that we need to repeat the loop.<br><br>We use the range function because
      it generates a sequence of numbers for the for loop. Here, we want a sequence that starts at 1 with
      every integer number up to but not including 10. We get this sequence by calling the function range(1,10).
  - body: Note that all statements inside the loop need to be indented with respect to the loop header.
- type: explanation
  location:
    snippet: print(num)
  explanations:
  - body: This statement prints each number in the sequence to the default standard output stream. The
      printed text is followed by the end-of-line character at the end.
