id: we_py_pythagorean_theorem_0
title: Pythagorean Theorem
description: Construct a program that accepts two input values from the user, one for each side of a right-angle
  triangle. The program uses the Pythagorean theorem (c^2 = a^2 + b^2) to calculate the length of the
  triangle's hypotenuse.
authors:
- first: Roya
  last: Hosseini
  email: moh70@pitt.edu
  affiliation: University of Pittsburgh
pedagogy:
  activity: worked-example
  difficulty: novice
  prereq_topics: []
  topics: []
runtime:
  language: python
  version: 3
statement: Write a program that accepts two input values from the user, one for each side of a right-angle
  triangle. The program uses the Pythagorean theorem (c^2 = a^2 + b^2) to calculate the length of the
  triangle's hypotenuse.
executions:
- title: Sample Run
  stdin:
  - '3'
  - '4'
  stdout: |-
    Enter the length of side A:
    Enter the length of side B:
    Given that side A is 3.0 and side B is 4.0 , the hypotenuse is 5.0
  console: |-
    Enter the length of side A:
    Enter the length of side B:
    Given that side A is 3.0 and side B is 4.0 , the hypotenuse is 5.0
  stderr: ''
  status: pass
elements:
- type: explanation
  location:
    snippet: text = input("Enter the length of side A:")
  explanations:
  - body: We need to read and process the input value that the user enters. To read the input value from
      the user, we need to use the input() function. This statement prompts the user to enter the length
      of side A, then reads the text entered by the user and places it in the variable text. The value
      that will be stored in variable text is a string.
- type: explanation
  location:
    snippet: side_A = float(text)
  explanations:
  - body: We need to convert the input text to its float representation because side A could have a decimal
      point. For this purpose, we use the conversion function float().
  - body: Note that this can only be done if user input could be translated into a valid floating-point
      value.
- type: explanation
  location:
    snippet: text = input("Enter the length of side B:")
  explanations:
  - body: We need to read and process the input value that the user enters. To read the input value from
      the user, we need to use the input() function. This statement prompts the user to enter the length
      of side B, then reads the text entered by the user and places it in the variable text. The value
      that will be stored in variable text is a string.
- type: explanation
  location:
    snippet: side_B = float(text)
  explanations:
  - body: We need to convert the input text to its float representation because side B could have a decimal
      point. For this purpose, we use the conversion function float().
  - body: Note that this can only be done if user input could be translated into a valid floating-point
      value.
- type: explanation
  location:
    snippet: squareside_A = side_A ** 2
  explanations:
  - body: To compute the length of the triangle's hypotenuse, we need to first compute the square of side
      A. We square side A by using the exponent operator **.
  - body: Note that side_A ** 2 raises the value of side_A to the power of 2.
- type: explanation
  location:
    snippet: squareside_B = side_B ** 2
  explanations:
  - body: To compute the length of the triangle's hypotenuse, we need to compute the square of side B
      too. We square side B by using the exponent operator **.
  - body: Note that side_B ** 2 raises the value of side_B to the power of 2.
- type: explanation
  location:
    snippet: hypotenuse = ( squareside_A + squareside_B ) ** 0.5
  explanations:
  - body: We use the Pythagorean theorem to obtain the length of the triangle's hypotenuse. To get the
      triangle's hypotenuse, we take the square root from the sum of square of side A and square of side
      B.
  - body: Note that we could take square root of a number by raising that number to the power of 0.5.
- type: explanation
  location:
    snippet: print("Given that side A is", side_A, "and side B is", side_B, ", the hypotenuse is", hypotenuse)
  explanations:
  - body: This statement prints to the default standard output stream the the length of the triangle's
      hypotenuse.<br>The printed text shows the arguments of the print function separated by the default
      delimiter (i.e., single space character) and followed by the end-of-line character at the end.
