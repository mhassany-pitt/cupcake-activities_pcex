elements:
- type: explanation
  location:
    snippet: 'for num in range(1, 15, 4):'
  explanations:
  - body: We need to repeat printing the numbers that are in a sequence from 1 (inclusive) to 16 (exclusive).
      To do this, we need to use a loop structure. We use for loops instead of a while loop because we
      need to repeat the loop a certain number of times, and for loops are best-suited in cases like this
      when we know ahead of time the number of times that we need to repeat the loop.<br><br>We use the
      range function because it generates a sequence of numbers for the for loop. Here, we want a sequence
      of every fourth number beginning with 1 and continuing up to but not including 15. We get this sequence
      by calling the function range(1,15,4).
  - body: The last number in the range function specifies how much to increase each successive integer
      in the sequence, if this is omitted then step defaults to 1. Since we want to print only every fourth
      number, we set the step to 4.<br><br>Note that all statements inside the loop need to be indented
      with respect to the loop header.
- type: explanation
  location:
    snippet: print(num)
  explanations:
  - body: This statement prints each number in the sequence to the default standard output stream. The
      printed text is followed by the end-of-line character at the end.
