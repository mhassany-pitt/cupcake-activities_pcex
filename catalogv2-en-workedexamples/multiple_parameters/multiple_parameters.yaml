elements:
- type: explanation
  location:
    snippet: 'def budget(rent, utilities, food, paycheck, current_savings):'
  explanations:
  - body: We need to first declare the function so that we can call it later. The following lines declare
      the function budget that takes five parameters and calculates the current savings.
  - body: Note that all statements following the header line are indented.
- type: explanation
  location:
    snippet: total_expenses = rent + utilities + food
  explanations:
  - body: This statement calculates the total expenses
- type: explanation
  location:
    snippet: current_savings = current_savings + paycheck
  explanations:
  - body: This statement calculates the total savings after getting paid and before deducting the total
      expenses.
- type: explanation
  location:
    snippet: current_savings = current_savings - total_expenses
  explanations:
  - body: This statement calculates the current saving after deducting the total expenses.
- type: explanation
  location:
    snippet: return (current_savings)
  explanations:
  - body: This statement returns the current saving.
- type: explanation
  location:
    snippet: 'print("after payday and expenses, you will have: ""$", budget(900, 150, 300, 700, 1500))'
  explanations:
  - body: This statement prints the current savings and invokes the function budget and passes five parameters
      to the function budget.
