title: PANDAS Statistics 1
description: From a class of 200 students, you have a dataset of students, their section, and grades.
  Start by inspecting the dataset. Get the sample size. Then, print top 5 examples. Next, get the mean.
  Also, try the pandas describe function. Get student counts by grade. Find students in section 2 and
  get the counts by grade.  Print the 10 entries in this result. Use the value_counts function
