id: we_py_phone_age_0
title: Buying a New Phone
description: Construct a program that determines whether it is time to buy a new phone based on the inputs
  that it receives from the user. A new phone should be bought if the phone breaks or the phone is at
  least 3 years old.
authors:
- first: Roya
  last: Hosseini
  email: moh70@pitt.edu
  affiliation: University of Pittsburgh
pedagogy:
  activity: worked-example
  difficulty: novice
  prereq_topics: []
  topics: []
runtime:
  language: python
  version: 3
statement: Write a program that determines whether it is time to buy a new phone based on the inputs that
  it receives from the user. A new phone should be bought if the phone breaks or the phone is at least
  3 years old.
executions:
- title: Sample Run
  stdin:
  - '3'
  - '0'
  stdout: |-
    Enter the phone age in years:
    Enter 1 if the phone is broken, otherwise enter 0:
    Yes! It is time to buy a new phone.
  console: |-
    Enter the phone age in years:
    Enter 1 if the phone is broken, otherwise enter 0:
    Yes! It is time to buy a new phone.
  stderr: ''
  status: pass
elements:
- type: explanation
  location:
    snippet: text = input("Enter the phone age in years:")
  explanations:
  - body: We need to read and process the input value that the user enters. To read the input value from
      the user, we need to use the input() function. This statement prompts the user to enter the phone
      age in years, then reads the text entered by the user and places it in the variable text. The value
      that will be stored in variable text is a string.
- type: explanation
  location:
    snippet: phone_age = int(text)
  explanations:
  - body: We need to convert the input text to its integer representation. For this purpose, we use the
      conversion function int().
  - body: Note that the conversion to integer can only be done if the string actually presents a number.
      If the input number is a float, the int() function cuts off the fractional part of the floating-point
      number to create an integer.
- type: explanation
  location:
    snippet: text = input("Enter 1 if the phone is broken, otherwise enter 0:")
  explanations:
  - body: We need to read and process the input value that the user enters. To read the input value from
      the user, we need to use the input() function. This statement prompts the user to enter whether
      the phone is broken, then reads the text entered by the user and places it in the variable text.
      The value that will be stored in variable text is a string.
- type: explanation
  location:
    snippet: input_num = int(text)
  explanations:
  - body: We need to convert the input text to its integer representation. For this purpose, we use the
      conversion function int().
  - body: Note that the conversion to integer can only be done if the string actually presents a number.
      If the input number is a float, the int() function cuts off the fractional part of the floating-point
      number to create an integer.
- type: explanation
  location:
    snippet: 'if input_num == 1 :'
  explanations:
  - body: To determine whether the phone is broken, we need to compare the integer that the user entered
      with 1. If the integer is 1, then variable is_broken should be initialized to True. Otherwise, variable
      is_broken should be initialized to False.
  - body: To check if the integer that the user entered is 1, we need to use == operator.
  - body: If the integer is equal to 1, then the body of this if statement gets executed. Otherwise, the
      body of this if statement is skipped.
- type: explanation
  location:
    snippet: is_broken = True
  explanations:
  - body: This statement initializes variable is_broken to True.
- type: explanation
  location:
    snippet: 'else:'
    nth: 1
  explanations:
  - body: If the above if test fails (i.e., when the integer that the user entered is different from 1),
      we should initialize variable is_broken to False.
  - body: The statement inside the body of this else statement is executed when the if condition is False,
      i.e., when the integer that the user entered is different from 1. Otherwise, the body of this else
      statement is skipped.
- type: explanation
  location:
    snippet: is_broken = False
  explanations:
  - body: This statement initializes variable is_broken to False.
- type: explanation
  location:
    snippet: need_phone = is_broken or phone_age >= 3
  explanations:
  - body: We need two conditions to determine if it is the time for a new phone. We use the or operator
      to combine the two conditions. The first condition is to test if the phone is broken and the second
      condition is to test if the phone age is at least 3 years old.
  - body: Note that the or operator yields the result True if at least one of the conditions is True.
- type: explanation
  location:
    snippet: 'if need_phone == True :'
  explanations:
  - body: To determine whether it's time to buy a new phone, we need to check the value of variable need_phone.
      If variable need_phone is True, we print a message that shows it is time to buy a new phone. Otherwise,
      we print a message that shows it's not yet the time to buy a new phone.
  - body: 'To check if the variable need_phone is True, we need to use == operator. Note that we could
      also use the following if statement to perform this check:<br>if need_phone :'
  - body: If the variable need_phone is True, then the body of this if statement gets executed. Otherwise,
      the body of this if statement is skipped.
- type: explanation
  location:
    snippet: print("Yes! It is time to buy a new phone.")
  explanations:
  - body: This statement prints to the default standard output stream the text in the double quotes. The
      printed text is followed by the end-of-line character at the end.
- type: explanation
  location:
    snippet: 'else:'
    nth: 2
  explanations:
  - body: If the above if test fails (i.e., when variable need_phone is False), we should print a message
      that shows it is not yet time to buy a new phone.
  - body: The statement inside the body of this else statement is executed when the if condition is False,
      i.e., when variable need_phone is False. Otherwise, the body of this else statement is skipped.
- type: explanation
  location:
    snippet: print("No! It is not yet the time to buy a new phone.")
  explanations:
  - body: This statement prints to the default standard output stream the text in the double quotes. The
      printed text is followed by the end-of-line character at the end.
