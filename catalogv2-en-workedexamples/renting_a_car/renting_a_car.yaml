elements:
- type: explanation
  location:
    snippet: text = input("Enter the customer's age:")
  explanations:
  - body: We need to read and process the input value that the car rental agent enters. To read the input
      value from the car rental agent, we need to use the input() function. This statement prompts the
      car rental agent to enter the customer's age, then reads the text entered by the car rental agent
      and places it in the variable text. The value that will be stored in variable text is a string.
- type: explanation
  location:
    snippet: age = int(text)
  explanations:
  - body: We need to convert the input text to its integer representation. For this purpose, we use the
      conversion function int().
  - body: Note that the conversion to integer can only be done if the string actually presents a number.
      If the input number is a float, the int() function cuts off the fractional part of the floating-point
      number to create an integer.
- type: explanation
  location:
    snippet: text = input("Enter 1 if the customer has driver's license, otherwise enter 0:")
  explanations:
  - body: We need to read and process the input value that the car rental agent enters. To read the input
      value from the car rental agent, we need to use the input() function. This statement prompts the
      car rental agent to enter whether the customer has driver's license, then reads the text entered
      by the car rental agent and places it in the variable text. The value that will be stored in variable
      text is a string.
- type: explanation
  location:
    snippet: input_num = int(text)
  explanations:
  - body: We need to convert the input text to its integer representation. For this purpose, we use the
      conversion function int().
  - body: Note that the conversion to integer can only be done if the string actually presents a number.
      If the input number is a float, the int() function cuts off the fractional part of the floating-point
      number to create an integer.
- type: explanation
  location:
    snippet: 'if input_num == 1 :'
  explanations:
  - body: To determine whether the customer has driver's license, we need to compare the integer that
      the car rental agent entered with 1. If the integer is 1, then variable has_license should be initialized
      to True. Otherwise, variable has_license should be initialized to False.
  - body: To check if the integer that the car rental agent entered is 1, we need to use == operator.
  - body: If the integer is equal to 1, then the body of this if statement gets executed. Otherwise, the
      body of this if statement is skipped.
- type: explanation
  location:
    snippet: has_license = True
  explanations:
  - body: This statement initializes variable has_license to True.
- type: explanation
  location:
    snippet: 'else:'
    nth: 1
  explanations:
  - body: If the above if test fails (i.e., when the integer that the car rental agent entered is different
      from 1), we should initialize variable has_license to False.
  - body: The statement inside the body of this else statement is executed when the if condition is False,
      i.e., when the integer that the car rental agent entered is different from 1. Otherwise, the body
      of this else statement is skipped.
- type: explanation
  location:
    snippet: has_license = False
  explanations:
  - body: This statement initializes variable has_license to False.
- type: explanation
  location:
    snippet: can_rent_car = age >= 21 and has_license
  explanations:
  - body: We need two conditions to determine whether the customer could rent a car. We use the and operator
      to combine the two conditions. The first condition is to test if the customer is 21 years of age
      or older and the second condition is to test if the customer has driver's license.
  - body: Note that the and operator yields the result True if both conditions are True.
- type: explanation
  location:
    snippet: 'if can_rent_car == True :'
  explanations:
  - body: To determine whether the customer could rent a car, we need to check the value of variable can_rent_car.
      If variable can_rent_car is True, we print a message that shows the customer could rent a car. Otherwise,
      we print a message that shows the customer could not rent a car.
  - body: 'To check if the variable can_rent_car is True, we need to use == operator. Note that we could
      also use the following if statement to perform this check:<br>if can_rent_car :'
  - body: If the variable can_rent_car is True, then the body of this if statement gets executed. Otherwise,
      the body of this if statement is skipped.
- type: explanation
  location:
    snippet: print("Yes! The customer could rent a car.")
  explanations:
  - body: This statement prints to the default standard output stream the text in the double quotes. The
      printed text is followed by the end-of-line character at the end.
- type: explanation
  location:
    snippet: 'else:'
    nth: 2
  explanations:
  - body: If the above if test fails (i.e., when variable can_rent_car is False), we should print a message
      that shows the customer could not rent a car.
  - body: The statement inside the body of this else statement is executed when the if condition is False,
      i.e., when variable can_rent_car is False. Otherwise, the body of this else statement is skipped.
- type: explanation
  location:
    snippet: print("No! The customer could not rent a car.")
  explanations:
  - body: This statement prints to the default standard output stream the text in the double quotes. The
      printed text is followed by the end-of-line character at the end.
