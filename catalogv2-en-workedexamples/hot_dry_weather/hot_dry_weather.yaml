title: Hot-Dry Weather
description: Construct a program that determines whether it is both too hot and too dry based on the inputs
  that it receives from the user.
authors:
- first: Roya
  last: Hosseini
  email: moh70@pitt.edu
  affiliation: University of Pittsburgh
