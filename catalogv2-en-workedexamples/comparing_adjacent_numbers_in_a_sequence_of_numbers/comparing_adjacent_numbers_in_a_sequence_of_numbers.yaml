id: we_py_check_adjacent_0
title: Comparing Adjacent Numbers in a Sequence of Numbers
description: |-
  Construct a program that checks whether a sequence of numbers, entered one at a time, contains adjacent duplicates. The user enters -1 to indicate the end of the input.
  For example, 4 is a duplicate in the sequence of numbers 1, 3, 4, 4, -1.
authors:
- first: Roya
  last: Hosseini
  email: moh70@pitt.edu
  affiliation: University of Pittsburgh
