elements:
- type: explanation
  location:
    snippet: 'class SLinkedListNode:'
  explanations:
  - body: Linked lists are defined by nodes in a list, instead of object literals in a normal list. This
      node class defines the contents in a list by setting the data, and the "next" node in the list.
  - body: Singly linked lists are only linked in one direction, to the next object in the list. A node
      is not linked to the previous object in the list.
- type: explanation
  location:
    snippet: 'def __init__(self, initData, initNext):'
  explanations:
  - body: Constructs a new node and initializes it to contain the govern object (initData), and link to
      the given next node (initNext).
- type: explanation
  location:
    snippet: 'def getData(self):'
  explanations:
  - body: Method to return the data contained inside a node.
- type: explanation
  location:
    snippet: 'def getNext(self):'
  explanations:
  - body: Method to return the data contained in the next node.
- type: explanation
  location:
    snippet: 'def setData(self, newData):'
  explanations:
  - body: Method to set or update the data contained inside a node.
- type: explanation
  location:
    snippet: 'def setNext(self, newNext):'
  explanations:
  - body: Method to set or update the data contained in the next node.
- type: explanation
  location:
    snippet: 'class SLinkedList:'
  explanations:
  - body: Linked lists can store data like a normal list, but it is more efficient because it can dynamically
      change size without shifting all other objects in the list. However, random access of a linked list
      is not allowed. To access a particular element in a linked list, the list has to be sequentially
      traversed from the first node (the head).
- type: explanation
  location:
    snippet: 'def __init__(self):'
  explanations:
  - body: The linked list is initialized with a head (currently none), and size (currently 0).
- type: explanation
  location:
    snippet: 'def __str__(self):'
  explanations:
  - body: __str__ method is automatically called when the print() function is invoked. This method prints
      the contents of the linked list in a readable format instead of the SLinkedList object.
- type: explanation
  location:
    snippet: current = self.head
    nth: 1
  explanations:
  - body: '"current" represents the current node, and is incremented to access each element in the linked
      list.'
- type: explanation
  location:
    snippet: 'while current != None:'
  explanations:
  - body: '"current" is not none unless it has reached the end of the linked list. Until then, the content
      from "current" will be appended to a string, and printed.'
- type: explanation
  location:
    snippet: 'if i > 0:'
  explanations:
  - body: '"i" is only greater than 0 when "current" is not the first object in the linked list. If it
      is not the first item, there is a comma between every element of the linked list until the last
      item.'
- type: explanation
  location:
    snippet: dataObject = current.getData()
  explanations:
  - body: dataObject represents the content inside the "current" node.
- type: explanation
  location:
    snippet: 'if dataObject != None:'
  explanations:
  - body: Assuming the current item in the linked list is not empty, the content of the linked list is
      concatenated to the dataObject from that node. This is repreated until the linked list ends.
- type: explanation
  location:
    snippet: current = current.getNext()
    nth: 1
  explanations:
  - body: '"current" is incremented to the next item in the list, and the while loop continues.'
- type: explanation
  location:
    snippet: return s
  explanations:
  - body: Ultimately, a comma-separated string containing all items of the linked list is returned.
- type: explanation
  location:
    snippet: 'def append(self, item):'
  explanations:
  - body: The append method adds an item to the end of the linked list. We must traverse the list to the
      end to add the item.
- type: explanation
  location:
    snippet: temp = SLinkedListNode(item, None)
  explanations:
  - body: A new node called "temp" is created for the item to be added.
- type: explanation
  location:
    snippet: 'if (self.head == None):'
  explanations:
  - body: If self.head is None, it means the linked list is currently empty, and the new node becomes
      the head.
- type: explanation
  location:
    snippet: current = self.head
    nth: 2
  explanations:
  - body: If the linked list already has nodes in it, "current" is set to self.head and the linked list
      is traversed through by a while loop until we reach the end.
- type: explanation
  location:
    snippet: 'while (current.getNext() != None):'
  explanations:
  - body: We know we have reached the end of the linked list when the next node is None.
- type: explanation
  location:
    snippet: current.setNext(temp)
  explanations:
  - body: When we reach the end of the linked list, the new item is appended to the end by setting the
      former last item item's "next" to the new item.
- type: explanation
  location:
    snippet: self.size += 1
  explanations:
  - body: Size of the new linked list is increased by 1.
