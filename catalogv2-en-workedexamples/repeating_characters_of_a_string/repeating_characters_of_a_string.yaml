id: we_py_str_repeat_chars_0
title: Repeating Characters of a String
description: |-
  Construct a program that has a function that receives a string and creates a new string that has each character of the given string repeated two times.
  For example, the new string that will be formed from the string 'abc' is 'aabbcc'.
