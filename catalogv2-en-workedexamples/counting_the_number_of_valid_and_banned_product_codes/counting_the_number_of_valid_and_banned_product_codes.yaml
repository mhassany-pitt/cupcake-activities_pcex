id: we_py_check_product_code_0
title: Counting the Number of Valid and Banned Product Codes
description: |-
  Suppose a hypothetical company uses codes to represent its various products. A product code includes, among other information, a character in the tenth position that represents the zone from which that product was made. Due to some reorganization, products from zone R are banned from being sold.
  Construct a program that reads product codes from the user and counts the number of valid and banned codes entered. Make sure that the program handles all possible exceptions.
  The program must ask the user for an input until the user enters STOP.
