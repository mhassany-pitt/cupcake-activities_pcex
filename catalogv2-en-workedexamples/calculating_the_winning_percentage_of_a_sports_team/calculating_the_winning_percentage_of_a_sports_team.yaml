id: we_py_win_percentage_0
title: 'Calculating the Winning Percentage of a Sports Team '
description: Construct a program that receives from the user the number of games that a sports team won
  in a tournament of 12 games and calculates the winning percentage of that sports team. The program must
  ask for the number of the games won until the user enters a valid number.
authors:
- first: Roya
  last: Hosseini
  email: moh70@pitt.edu
  affiliation: University of Pittsburgh
