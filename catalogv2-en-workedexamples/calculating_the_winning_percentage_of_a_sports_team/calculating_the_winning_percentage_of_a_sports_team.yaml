  activity: worked-example
  difficulty: novice
  prereq_topics: []
  topics: []
runtime:
  language: python
  version: 3
statement: Write a program that receives from the user the number of games that a sports team won in a
  tournament of 12 games and calculates the winning percentage of that sports team. The program must ask
  for the number of the games won until the user enters a valid number.
executions:
- title: Sample Run
  stdin:
  - '-1'
  - '13'
  - '15'
  - '5'
  stdout: "Enter the number of games that the sports team won in the tournament: \nEnter the number of\
    \ games that the sports team won in the tournament: \nEnter the number of games that the sports team\
    \ won in the tournament: \nEnter the number of games that the sports team won in the tournament: \n\
    Winning percentage: 0.4166666666666667"
  console: "Enter the number of games that the sports team won in the tournament: \nEnter the number of\
    \ games that the sports team won in the tournament: \nEnter the number of games that the sports team\
    \ won in the tournament: \nEnter the number of games that the sports team won in the tournament: \n\
    Winning percentage: 0.4166666666666667"
  stderr: ''
  status: pass
elements:
- type: explanation
  location:
    snippet: total_games = 12
  explanations:
  - body: We need variable total_games to store the total number of games in the tournament. This is required
      for calculating the percentage of the games that the sports team won. We initialize it to 12 because
      we have 12 games in the tournament.
- type: explanation
  location:
    snippet: 'text = input("Enter the number of games that the sports team won in the tournament: ")'
    nth: 1
  explanations:
  - body: We need to read and process the input value that the user enters. To read the input value from
      the user, we need to use the input() function. This statement prompts the user to enter the number
      of games that the sports team won in the tournament, then reads the text entered by the user and
      places it in the variable text. The value that will be stored in variable text is a string.
- type: explanation
  location:
    snippet: wins = int(text)
    nth: 1
  explanations:
  - body: We need to convert the input text to its integer representation. For this purpose, we use the
      conversion function int().
  - body: Note that the conversion to integer can only be done if the string actually presents a number.
      If the input number is a float, the int() function cuts off the fractional part of the floating-point
      number to create an integer.
- type: explanation
  location:
    snippet: 'while wins < 0 or wins > total_games :'
  explanations:
  - body: We need to validate the number that the user has entered and ask for a valid input as long as
      the user enters an invalid number. Therefore, we need to use a loop structure. Since we don't know
      ahead of time how many times the loop will be repeated, we need to use a while loop. The condition
      in the while loop tests whether the body of the loop should be repeated, so it should test whether
      the number that the user entered is an invalid number.<br><br>The input is an invalid number if
      it is outside the valid range, that is when the number that the user enters is negative or greater
      than the total number of games in the tournament.
  - body: The body of the while loop is repeated as long as the user enters an integer that is negative
      (less than zero) or greater than the total number of games in the tournament. The loop terminates
      when the loop condition evaluates to False, that is when the user enters a non-negative number that
      is less than or equal to the total number of games in the tournament.<br><br>Note that the logical
      or operator is True if one or the other or both operands are True.
- type: explanation
  location:
    snippet: 'text = input("Enter the number of games that the sports team won in the tournament: ")'
    nth: 2
  explanations:
  - body: We prompt the user to enter the number of games that the sports team won because the previous
      number was not a valid number. To read the input value from the user, we need to use the input()
      function.<br><br>This statement prompts the user to enter the number of games that the sports team
      won in the tournament, then reads the text entered by the user and places it in the variable text.
      The value that will be stored in variable text is a string.
- type: explanation
  location:
    snippet: wins = int(text)
    nth: 2
  explanations:
  - body: We need to convert the input text to its integer representation. For this purpose, we use the
      conversion function int().
  - body: Note that the conversion to integer can only be done if the string actually presents a number.
      If the input number is a float, the int() function cuts off the fractional part of the floating-point
      number to create an integer.
- type: explanation
  location:
    snippet: ratio = wins / total_games
  explanations:
  - body: We need to calculate the percentage of game that the sports team won by dividing the number
      of games won by the total number of games in the tournament. We store the result of the division
      into variable ratio.<br><br>Note that since we want to keep the fractional part of the division
      result, we need to use the real division by using / operator.
- type: explanation
  location:
    snippet: print("Winning percentage:", ratio)
  explanations:
  - body: This statement prints to the default standard output stream the text "Winning percentage:" and
      the value of variable ratio.<br>The printed text shows the arguments of the print function separated
      by the default delimiter (i.e., single space character) and followed by the end-of-line character
      at the end.
