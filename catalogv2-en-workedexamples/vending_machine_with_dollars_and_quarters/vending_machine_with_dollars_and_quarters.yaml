executions:
- title: Sample Run
  stdin: []
  stdout: 'Enter bill value in dollars (1 = $1 bill, 5 = $5 bill, etc.):'
  console: 'Enter bill value in dollars (1 = $1 bill, 5 = $5 bill, etc.):'
  stderr: ''
  status: pass
elements:
- type: explanation
  location:
    snippet: pennies_per_dollar = 100
  explanations:
  - body: The pennies_per_dollar, we set it to 100 because there are 100 pennies in a dollar.
- type: explanation
  location:
    snippet: pennies_per_quarter = 25
  explanations:
  - body: The pennies_per_quarter, we set it to 25 because there are 25 pennies in a quarter.
- type: explanation
  location:
    snippet: 'text = input("Enter bill value in dollars (1 = $1 bill, 5 = $5 bill, etc.): ")'
  explanations:
  - body: We need to read and process the input value that the user enters. To read the input value from
      the user, we need to use the input() function. This statement prompts the user to enter the bill
      value in dollars, then reads the text entered by the user and places it in the variable text. The
      value that will be stored in variable text is a string.
- type: explanation
  location:
    snippet: bill_value = int(text)
  explanations:
  - body: We need to convert the input text to its integer representation. For this purpose, we use the
      conversion function int().
  - body: Note that the conversion to integer can only be done if the string actually presents a number.
      If the input number is a float, the int() function cuts off the fractional part of the floating-point
      number to create an integer.
- type: explanation
  location:
    snippet: 'text = input("Enter item price in pennies: ")'
  explanations:
  - body: We need to read and process the input value that the user enters. To read the input value from
      the user, we need to use the input() function. This statement prompts the user to enter the item
      price in pennies, then reads the text entered by the user and places it in the variable text. The
      value that will be stored in variable text is a string.
- type: explanation
  location:
    snippet: item_price = int(text)
  explanations:
  - body: We need to convert the input text to its integer representation. For this purpose, we use the
      conversion function int().
  - body: Note that the conversion to integer can only be done if the string actually presents a number.
      If the input number is a float, the int() function cuts off the fractional part of the floating-point
      number to create an integer.
- type: explanation
  location:
    snippet: change_due = pennies_per_dollar * bill_value - item_price
  explanations:
  - body: To compute the change due, we need to obtain the pennies in the bill value and then subtract
      the item price from that. Note that the precedence rules dictate that the multiplication happens
      before the subtraction in this expression.
  - body: We obtain pennies in the bill value by multiplying the number of pennies in a dollar (stored
      in the variable pennies_per_dollar) by the bill value.
- type: explanation
  location:
    snippet: dollars = change_due // pennies_per_dollar
  explanations:
  - body: To obtain the dollars, we divide the change due by the number of pennies per dollar. Note that
      we want to truncate the fractional part of the result, if there is any. Therefore, we need to use
      the floor division by using // operator.
  - body: Note that the number of pennies per dollar is stored in the variable pennies_per_dollar.
- type: explanation
  location:
    snippet: change_due = change_due % pennies_per_dollar
  explanations:
  - body: To obtain the remaining change due after taking away the dollars, we have to take the remainder
      of the change due divided by pennies per dollar. The % operator returns the remainder of the division.
  - body: Note that the number of pennies per dollar is stored in the variable pennies_per_dollar.
- type: explanation
  location:
    snippet: quarters = change_due // pennies_per_quarter
  explanations:
  - body: To obtain the quarters in the remaining change due, we have to divide the change due by pennies
      per quarter. Note that we want to truncate the fractional part of the result, if there is any. Therefore,
      we need to use the floor division by using // operator.
  - body: Note that the number of pennies per quarter is stored in the variable pennies_per_quarters.
- type: explanation
  location:
    snippet: print("Your change consists of:")
  explanations:
  - body: This statement prints to the default standard output stream the text in the double quotes. The
      printed text is followed by the end-of-line character at the end.
- type: explanation
  location:
    snippet: print(dollars, "dollars")
  explanations:
  - body: This statement prints to the default standard output stream the value of variable dollars and
      the text "dollars".<br>The printed text shows the arguments of the print function separated by the
      default delimiter (i.e., single space character) and followed by the end-of-line character at the
      end.
- type: explanation
  location:
    snippet: print(quarters, "quarters")
  explanations:
  - body: This statement prints to the default standard output stream the value of variable quarters and
      the text "quarters".<br>The printed text shows the arguments of the print function separated by
      the default delimiter (i.e., single space character) and followed by the end-of-line character at
      the end.
