id: we_py_vending_machine__664e24f091363872f0ba3330_0
title: Vending Machine With Dollars and Quarters
description: Suppose we have a vending machine that gives change. A customer selects an item for purchase
  and inserts a bill into the vending machine. The vending machine dispenses the purchased item and gives
  change. We will assume that all item prices are multiples of 25 cents, and the machine gives all change
  in dollar and quarters. Construct a program that computes how many dollars and quarters to return to
  the customer.
