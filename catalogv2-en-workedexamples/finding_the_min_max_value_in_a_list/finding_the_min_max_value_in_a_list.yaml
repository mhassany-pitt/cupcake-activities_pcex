elements:
- type: explanation
  location:
    snippet: values = [5, 8, 4, 78, 95, 12, 1, 0, 6, 35, 46]
  explanations:
  - body: We define the list referred by variable values to hold specified numbers. We initialize the
      list by separating elements with a comma and enclosing the collection in square brackets [ ].
- type: explanation
  location:
    snippet: max_value = values[0]
  explanations:
  - body: We need variable max_value to store the maximum value of the list. We initialize this variable
      by the first value in the list because we initially assume that the first value is the maximum.
- type: explanation
  location:
    snippet: 'for i in range(1, len(values)):'
  explanations:
  - body: We use a for loop to iterate over the remaining list indexes and searching for the maximum value.
      We need the remaining list indexes to start at 1 with every integer number up to but not including
      the list length. We get this sequence by calling the range(1,len(values)) function.
  - body: Note that the loop starts at 1 because we already checked the value at the index 0 of the list
      when initializing the variable max_value. Also, note that the function len(values) returns the number
      of the values in the list.
  - body: Note that all statements inside the loop need to be indented with respect to the loop header.
- type: explanation
  location:
    snippet: 'if (values[i] > max_value):'
  explanations:
  - body: We need to compare the value at the index i of the list with the maximum value stored in variable
      max_value. If the value at index i is larger than the maximum value, then we need to set the maximum
      value to the value of the element at index i.
  - body: If the list value at index i is greater than the maximum value so far, then the body of this
      if statement gets executed. Otherwise, the body of this if statement is skipped.
- type: explanation
  location:
    snippet: max_value = values[i]
  explanations:
  - body: This statement sets the maximum value to the value of the element at index i of the list.
- type: explanation
  location:
    snippet: print("Maximum value:", max_value)
  explanations:
  - body: This statement prints to the default standard output stream the text "Maximum value:" and the
      value of variable max_value.<br>The printed text shows the arguments of the print function separated
      by the default delimiter (i.e., single space character) and followed by the end-of-line character
      at the end.
