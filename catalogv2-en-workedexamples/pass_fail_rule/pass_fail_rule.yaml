id: we_py_fail_course_0
title: Pass-Fail Rule
description: Construct a program to determine whether a student fails the course based on the inputs that
  it receives from the instructor. The student fails the course if the exam score is less than 55 or student
  has more than 2 missing homework.
authors:
- first: Roya
  last: Hosseini
  email: moh70@pitt.edu
  affiliation: University of Pittsburgh
pedagogy:
  activity: worked-example
  difficulty: novice
  prereq_topics: []
  topics: []
runtime:
  language: python
  version: 3
statement: Write a program to determine whether a student fails the course based on the inputs that it
  receives from the instructor. The student fails the course if the exam score is less than 55 or student
  has more than 2 missing homework.
executions:
- title: Sample Run
  stdin:
  - '55'
  - '4'
  stdout: |-
    Enter the exam score:
    Enter number of missing homework:
    Yes! The student fails the course.
  console: |-
    Enter the exam score:
    Enter number of missing homework:
    Yes! The student fails the course.
  stderr: ''
  status: pass
elements:
- type: explanation
  location:
    snippet: text = input("Enter the exam score:")
  explanations:
  - body: We need to read and process the input value that the instructor enters. To read the input value
      from the instructor, we need to use the input() function. This statement prompts the instructor
      to enter the exam score, then reads the text entered by the instructor and places it in the variable
      text. The value that will be stored in variable text is a string.
- type: explanation
  location:
    snippet: exam_score = int(text)
  explanations:
  - body: We need to convert the input text to its integer representation. For this purpose, we use the
      conversion function int().
  - body: Note that the conversion to integer can only be done if the string actually presents a number.
      If the input number is a float, the int() function cuts off the fractional part of the floating-point
      number to create an integer.
- type: explanation
  location:
    snippet: text = input("Enter number of missing homework:")
  explanations:
  - body: We need to read and process the input value that the instructor enters. To read the input value
      from the instructor, we need to use the input() function. This statement prompts the instructor
      to enter the number of missing homework, then reads the text entered by the instructor and places
      it in the variable text. The value that will be stored in variable text is a string.
- type: explanation
  location:
    snippet: number_of_missing_hw = int(text)
  explanations:
  - body: We need to convert the input text to its integer representation. For this purpose, we use the
      conversion function int().
  - body: Note that the conversion to integer can only be done if the string actually presents a number.
      If the input number is a float, the int() function cuts off the fractional part of the floating-point
      number to create an integer.
- type: explanation
  location:
    snippet: is_failing = exam_score < 55 or number_of_missing_hw > 2
  explanations:
  - body: We need two conditions to determine whether a student fails the course. We use the or operator
      to combine the two conditions. The first condition is to test if the exam score is less than 55
      and the second condition is to test if the number of missing homework is more than 2.
  - body: Note that the or operator yields the result True if at least one of the conditions is True.
- type: explanation
  location:
    snippet: 'if is_failing == True :'
  explanations:
  - body: To determine whether the student fails the course, we need to check the value of variable is_failing.
      If variable is_failing is True, we print a message that shows the student fails the course. Otherwise,
      we print a message that shows the student does not fail the course.
  - body: 'To check if the variable is_failing is True, we need to use == operator. Note that we could
      also use the following if statement to perform this check:<br>if is_failing :'
  - body: If the variable is_failing is True, then the body of this if statement gets executed. Otherwise,
      the body of this if statement is skipped.
- type: explanation
  location:
    snippet: print("Yes! The student fails the course.")
  explanations:
  - body: This statement prints to the default standard output stream the text in the double quotes. The
      printed text is followed by the end-of-line character at the end.
- type: explanation
  location:
    snippet: 'else:'
  explanations:
  - body: If the above if test fails (i.e., when variable is_failing is False), we should print a message
      that shows the student does not fail the course.
  - body: The statement inside the body of this else statement is executed when the if condition is False,
      i.e., when variable is_failing is False. Otherwise, the body of this else statement is skipped.
- type: explanation
  location:
    snippet: print("No! The student does not fail the course.")
  explanations:
  - body: This statement prints to the default standard output stream the text in the double quotes. The
      printed text is followed by the end-of-line character at the end.
