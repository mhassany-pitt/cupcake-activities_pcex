  language: python
  version: 3
statement: Write a program that takes a user's inputs and multiplies the inputs.Then print the type of
  the result, convert the result to float and print its float absolute value.
executions:
- title: Sample Run
  stdin:
  - '17'
  - '5'
  stdout: |-
    Enter the first integer:
    Enter the second integer:
    <class 'int'>
    85.0
    85.0
  console: |-
    Enter the first integer:
    Enter the second integer:
    <class 'int'>
    85.0
    85.0
  stderr: ''
  status: pass
elements:
- type: explanation
  location:
    snippet: import math
  explanations:
  - body: We need to first import the math library since we are going to use built-in functions in the
      math library later.
- type: explanation
  location:
    snippet: input_a = input("Enter the first integer:")
  explanations:
  - body: We need to read and process the input value that the user enters. To read the input value from
      the user, we need to use the input() function. This statement prompts the user to enter the first
      value, then reads the text entered by the user and places it in the variable input_a. The value
      that will be stored in variable input_a is a string.
- type: explanation
  location:
    snippet: a = int(input_a)
  explanations:
  - body: We need to convert the input input_a to its integer representation. For this purpose, we use
      the conversion function int()
  - body: Note that the conversion to integer can only be done if the string actually presents a number.
      If the input number is a float, the int() function cuts off the fractional part of the floating-point
      number to create an integer.
- type: explanation
  location:
    snippet: input_b = input("Enter the second integer:")
  explanations:
  - body: We need to read and process the input value that the user enters. To read the input value from
      the user, we need to use the input() function. This statement prompts the user to enter the first
      value, then reads the text entered by the user and places it in the variable input_b. The value
      that will be stored in variable input_b is a string.
- type: explanation
  location:
    snippet: b = int(input_b)
  explanations:
  - body: We need to convert the input input_b to its integer representation. For this purpose, we use
      the conversion function int()
  - body: Note that the conversion to integer can only be done if the string actually presents a number.
      If the input number is a float, the int() function cuts off the fractional part of the floating-point
      number to create an integer.
- type: explanation
  location:
    snippet: c = a*b
  explanations:
  - body: We multiply the two input values by using the mathematical expression *
- type: explanation
  location:
    snippet: print(type(c))
  explanations:
  - body: We want to print and check the type of the variable c.  We use the built-in function type().
- type: explanation
  location:
    snippet: print(float(c))
  explanations:
  - body: We want to print and convert the variable c to float. We use the built-in function float().
- type: explanation
  location:
    snippet: print(math.fabs(c))
  explanations:
  - body: We want to print the float absolute value of the variable c. We use the built-in function fabs()
      from math library.
