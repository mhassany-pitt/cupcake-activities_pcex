- type: explanation
  location:
    snippet: acct3.withdraw(-100.00, 1.50)
  explanations:
  - body: This statement invokes the method withdraw of acct3 to withdraw $-100 with a fee of $1.50. Here,
      acct3 is the implied subject (instance) passed to self.<br>Note that it's possible to ignore the
      return value from a method if the returned value is not going to be used. In this case, the withdraw
      method will still execute normally. However, since the method withdraw prevents the withdrawal of
      a negative amount, this transaction is considered to be invalid and acct3's balance will not be
      updated.
- type: explanation
  location:
    snippet: acct2.add_interest()
  explanations:
