elements:
- type: explanation
  location:
    snippet: 'class Account1 :'
  explanations:
  - body: We define the class Account1 to represent a bank account with basic services.
- type: explanation
  location:
    snippet: 'def __init__(self, owner, account, initial) :'
  explanations:
  - body: To specify the initial state of a bank account, we need to have an __init__ method in the class
      Account1 that accepts initial values for the bank account. The __init__ accepts the name of the
      bank account, account number, and initial balance and stores them into the new Account1 object’s
      acct_name, acct_number, and balance, respectively.
  - body: The __init__ method is run automatically by Python each time an instance is created. The argument
      (named self) is passed in automatically by the interpreter when the method is invoked on an instance
      of the class.
  - body: Note that Python automatically fills the first argument in with the instance object that is
      the implied subject of the method call. Therefore, when this method is invoked on an instance of
      the class, the last three parameters must be passed to the method.
- type: explanation
  location:
    snippet: self.__acct_name = owner
  explanations:
  - body: This statement sets the instance attribute acct_name to the first parameter value (owner).<br>self
      is the instance of the class and self.__acct_name is the account name. We start the attribute name
      by two underscore (self.__acct_name) to prevent accessing the attribute directly from outside of
      the class.
- type: explanation
  location:
    snippet: self.__acct_number = account
  explanations:
  - body: This statement sets instance attribute acct_number to the second parameter value (account).<br>self
      is the instance of the class and self.__acct_number is the account number. We start the attribute
      name by two underscore (self.__acct_number) to prevent accessing the attribute directly from outside
      of the class.
- type: explanation
  location:
    snippet: self.__balance = initial
  explanations:
  - body: This statement sets instance attribute balance to the third parameter value (initial).<br>self
      is the instance of the class and self.__balance is the account's balance. We start the attribute
      name by two underscore (self.__balance) to prevent accessing the attribute directly from outside
      of the class.
- type: explanation
  location:
    snippet: 'def deposit(self, amount) :'
  explanations:
  - body: This method deposits the specified amount into this account and returns the new balance. The
      balance is not modified if the deposit amount is invalid. Note that the first argument (named self)
      is passed in automatically by the interpreter when the method is invoked on an instance of the class.
  - body: Python automatically fills the first argument in with the instance object that is the implied
      subject of the method call. Therefore, when this method is invoked on an instance of the class,
      only the last parameter (amount) must be passed to the method.
- type: explanation
  location:
    snippet: 'if (amount > 0) :'
  explanations:
  - body: Before we add the specified amount to the balance, we need to perform a test to check whether
      the deposit amount is valid.
  - body: The if statement tests whether the deposit amount is greater than 0. If the deposit amount is
      greater than 0, then the body of this if statement gets executed. Otherwise, the body of this if
      statement is skipped.
- type: explanation
  location:
    snippet: 'def withdraw(self, amount, fee) :'
  explanations:
  - body: This method withdraws the specified amount and fee from this account and returns the new balance.
      The balance is not modified if either the withdraw amount or fee are invalid or the balance is insufficient.
      Note that the first argument (named self) is passed in automatically by the interpreter when the
      method is invoked on an instance of the class.
  - body: Python automatically fills the first argument in with the instance object that is the implied
      subject of the method call. Therefore, when this method is invoked on an instance of the class,
      only the last two parameters must be passed to the method.
- type: explanation
  location:
    snippet: 'if (amount > 0 and fee >= 0 and amount+fee < self.__balance) :'
  explanations:
  - body: Before we withdraw the specified amount and fee from the account, we need to perform a test
      to check whether the withdraw amount and fee are valid and the balance is sufficient.
  - body: The if statement tests whether the withdraw amount is greater than zero, fee is greater than
      or equal to zero, and the balance is sufficient. If the withdraw amount and fee are valid and the
      balance is sufficient, then the body of this if statement gets executed. Otherwise, the body of
      this if statement is skipped.
  - body: Note that the and operator yields the result True if both conditions are True.
- type: explanation
  location:
    snippet: 'def add_interest(self) :'
  explanations:
  - body: This method adds interest to this account and returns the new balance. Note that the first argument
      (named self) is passed in automatically by the interpreter when the method is invoked on an instance
      of the class.
  - body: Python automatically fills the first argument in with the instance object that is the implied
      subject of the method call. Therefore, when this method is invoked on an instance of the class,
      no parameter must be passed to the method.
- type: explanation
  location:
    snippet: 'def get_name(self) :'
  explanations:
  - body: This method returns the name of the account.Note that the first argument (named self) is passed
      in automatically by the interpreter when the method is invoked on an instance of the class.
  - body: Python automatically fills the first argument in with the instance object that is the implied
      subject of the method call. Therefore, when this method is invoked on an instance of the class,
      no parameter must be passed to the method.
- type: explanation
  location:
    snippet: 'def get_balance(self) :'
  explanations:
  - body: This method returns the current balance of the account. Note that the first argument (named
