- type: explanation
  location:
    snippet: acct1.deposit(44.10)
  explanations:
  - body: This statement invokes the method deposit of the acct1 to deposit $44.10. Note that acct1 is
      the implied subject (instance) passed to self. Also note that it's possible to ignore the return
      value from a method if the returned value is not going to be used. In this case, the deposit method
      will still execute normally, updating the account balance with the specified amount.
- type: explanation
  location:
    snippet: adams_balance = acct2.deposit(75.25)
  explanations:
  - body: This statement invokes the method deposit of the acct2 to deposit $75.25. Note that acct2 is
      the implied subject (instance) passed to self. Here, the value that is returned from the deposit
      method is assigned to variable adams_balance.
- type: explanation
  location:
    snippet: 'print("{:s}''s balance after deposit: {:.2f}".format(acct2.get_name(), adams_balance))'
  explanations:
  - body: This statement prints the balance of acct2 after the deposit transaction using the format function.<br>{:s}
      is replaced by the account name. We invoke the method get_name of acct2 to get the account's name.
      Note that acct2 is the implied subject (instance) passed to self.<br>{:.2f} prints the balance with
      two decimal digits.
  - body: Note that we do not necessarily have to store the returned value from the invoked method in
      a variable. We could use the returned values directly in the format method.
  - body: The format function returns the result of replacing each {…} placeholder in the template string
      with its corresponding argument passed to the format function. Anything else, which is not contained
      in curly braces will be literally printed, i.e. without any changes.
  - body: 'The format specification inside a pair of curly braces starts with a : and followed by the
      text that specifies the data type. The data type s requires a string argument and the data type
      f requires a floating-point argument. An error will occur if the argument is not the expected data
      type.'
- type: explanation
  location:
    snippet: 'print("{:s}''s balance after deposit: {:.2f}".format(acct2.get_name(), acct2.withdraw (480,
      1.50)))'
  explanations:
