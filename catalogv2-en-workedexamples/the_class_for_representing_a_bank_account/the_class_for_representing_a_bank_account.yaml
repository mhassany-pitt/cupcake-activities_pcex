  - body: Python automatically fills the first argument in with the instance object that is the implied
      subject of the method call. Therefore, when this method is invoked on an instance of the class,
      no parameter must be passed to the method.
- type: explanation
  location:
    snippet: acct1 = Account1("Tina Murphy", 72354, 25.59)
  explanations:
  - body: We create an instance of the class Account1 to demonstrate the creation and use of Account1
      instances
  - body: This statement creates a Account1 instance with the specified account name, account number,
      and account balance.
  - body: Note that we can create an Account1 object with the specified account name, account number,
      and account balance only when we have a __init__ method in the Account1 class that accepts these
      parameters in the order that they are specified.
