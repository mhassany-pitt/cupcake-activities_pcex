title: Selection sort
description: Ascending-order Selection sort operates by finding the minimum element of an array and moving
  it to the “beginning” of the array, with the “beginning” of the array incrementing forward after each
  element is placed in its proper position. Construct a function that performs selection sort on the given
  list, in ascending order.
