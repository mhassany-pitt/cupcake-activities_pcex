elements:
- type: explanation
  location:
    snippet: num = 1234
  explanations:
  - body: We need variable num to store the integer that we want to print its digits.
- type: explanation
  location:
    snippet: 'while num > 0 :'
  explanations:
  - body: We need to process the digits of the integer from right to left and print them. Therefore, we
      need to use a loop structure. Since we don't know ahead of time how many times the loop will be
      repeated, we need to use a while loop. The condition in the while loop tests whether the body of
      the loop should be repeated, so it should test whether there are more digits left that we have not
      processed yet.<br><br>We could check whether the are more digits left by checking whether the variable
      num, which gets updated in the body of the loop, is greater than zero. If variable num is greater
      than zero, then it must have at least one digit, and in that case, the body of the do loop will
      be repeated again.
  - body: The body of the while loop is repeated as long as there are more digits left that we have not
      processed yet. The loop terminates when the loop condition evaluates to False, that is when we run
      out of digits to process.
- type: explanation
  location:
    snippet: last_digit = num % 10
  explanations:
  - body: We need to extract the last digit in the 1's position of the integer. For example, if the integer
      is 1234, we want to extract the digit 4 that is in 1's position of the integer. We do this by calculating
      the remainder of the division of the integer by 10.
- type: explanation
  location:
    snippet: print(last_digit)
  explanations:
  - body: This statement prints each digit in the integer to the default standard output stream. Each
      printed digit is followed by the end-of-line character at the end.
- type: explanation
  location:
    snippet: num = num // 10
  explanations:
  - body: We truncate the extracted digit that we processed from the original integer by dividing the
      integer by 10. Note that we want to truncate the fractional part of the result, if there is any.
      Therefore, we need to use the floor division by using // operator. Therefore, this division will
      remove the digit that we processed (last_digit) and we can move on to the next digit.
