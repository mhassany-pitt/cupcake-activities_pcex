id: we_py_list_rotate_0
title: Rotating the List Values
description: Construct a program that has a function that receives a list of values and returns the list
  rotated to the left by 1 position so that the value at the front of the list goes to the back and the
  order of the other values stays the same. For example, if the list is [1, 2, 3, 4, 5, 6], the program
  will change it to [2, 3, 4, 5, 6, 1].
