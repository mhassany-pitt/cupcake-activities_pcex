  topics: []
runtime:
  language: python
  version: 3
statement: Write a program that has a function that receives a list of values and returns the list rotated
  to the left by 1 position so that the value at the front of the list goes to the back and the order
  of the other values stays the same. For example, if the list is [1, 2, 3, 4, 5, 6], the program will
  change it to [2, 3, 4, 5, 6, 1].
executions:
- title: Sample Run
  stdin: []
  stdout: |-
    Original list: [3, 8, 9, 8, 7, 5]
    Rotated list: [8, 9, 8, 7, 5, 3]
  console: |-
    Original list: [3, 8, 9, 8, 7, 5]
    Rotated list: [8, 9, 8, 7, 5, 3]
  stderr: ''
  status: pass
elements:
- type: explanation
  location:
    snippet: 'def rotate_left(lst):'
  explanations:
  - body: We need to first declare the function so that we can call it later. The following lines declare
      the function rotate_left that takes a list, rotates the list to the left by one position, and returns
      the rotated list.<br><br>Note that all statements following the header line are indented.
- type: explanation
  location:
    snippet: first = lst[0]
  explanations:
  - body: The value at the front of the list is supposed to go to the back of the list, and the other
      values are supposed to rotate forward. We can make the task easier by storing the value at the front
      of the list into a local variable and then shift the other values to the left by one position.<br><br>This
      statement stores the element at index 0 (i.e., value at the front of the list) in the variable first.
      We will use variable first later to move the value at the front to the back of the list.
- type: explanation
  location:
    snippet: 'for i in range(len(lst)-1):'
  explanations:
  - body: With value at the front safely tucked away, we now have to shift the remaining values to the
      left by one position. We could break down the overall task into shifting operations, each of which
      is a simple assignment statement.<br><br>Because of repeated shift operations on the list elements,
      we’d want to write this with a for loop. We’ll replace the element at index i with the value currently
      stored in the element at index i+1, this will shift the value at index i+1 to the left, by one position.
  - body: Note that, instead of range(len(lst)), we need to use range(len(lst)-1)). The reason is that
      in the assignment statement in the loop body we always move the element one position ahead of the
      element at the current index. So, to shift all the remaining elements, we need to iterate through
      indexes that start at 0 with every integer number up to but not including len(lst)-1.
  - body: Note that len(lst) returns the number of the values in the list. Also, note that all statements
      inside the loop need to be indented with respect to the loop header.
- type: explanation
  location:
    snippet: lst[i] = lst[i + 1]
  explanations:
  - body: We need to shift value at index i+1 to value at index i. We do this by setting the value at
      index i to the value at index i+1.
- type: explanation
  location:
    snippet: lst[len(lst)-1] = first
  explanations:
  - body: After shifting the values to the left, we’ve made room at the end of the list for the value
      that used to be at the front of the list (which is currently stored in a local variable called first).
      This statement copies the value of variable first to the index of the last element in the list.
  - body: Note that len(lst)-1 is the index of the last element in the list.
- type: explanation
  location:
    snippet: return lst
  explanations:
  - body: Now that we finished rotating the list elements, we need to return the rotated list. The return
      statement, when reached, ends the function call and sends the result back to the caller.
- type: explanation
  location:
    snippet: values =  [3, 8, 9, 8, 7, 5]
  explanations:
  - body: We define the list referred by variable values to hold specified numbers. We initialize the
      list by separating elements with a comma and enclosing the collection in square brackets [ ].
- type: explanation
  location:
    snippet: print("Original list:", values)
  explanations:
  - body: This statement prints to the default standard output stream the text "Original list:" followed
      by the content of the list.<br>The printed text shows the arguments of the print function separated
      by the default delimiter (i.e., single space character) and followed by the end-of-line character
      at the end.
  - body: Note that we can see the content of the list by calling the print function and passing the list
      to that.
- type: explanation
  location:
    snippet: 'print("Rotated list: ", rotate_left(values))'
  explanations:
  - body: 'This statement prints to the default standard output stream the text "Rotated list: " followed
      by the content of the list returned from the function call.<br><br>Note that any changes that were
      made to the list within the rotate_left function affect the original list in the calling function.
      That is, after the function call, the list referred by variables values will be changed to the rotated
      list.'
  - body: Note that we do not necessarily have to store the returned list from the function call in a
      variable. We could use the list returned from the function call directly in the print function.
  - body: Note that the function call must be done after the function is declared. Also note that we can
      see the content of the list by calling the print function and passing the list to that.
