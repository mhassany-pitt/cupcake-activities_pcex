id: we_py_double_linked_list_0
title: Doubly Linked List
description: Create the necessary classes for a Doubly Linked List, containing the method insert_at_start(data)
  to add a new item to the beginning of the linked list, insert_at_end(data) to add a new item to the
  end of the linked list, delete_at_start() to delete the first item from the link, and an __str__ method
  to print out the doubly linked list. Test the doubly linked list after all classes and methods are created.
