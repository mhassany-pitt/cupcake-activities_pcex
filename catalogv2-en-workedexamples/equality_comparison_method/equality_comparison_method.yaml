  - body: Initializes an instance of each class, with a value passed in.
- type: explanation
  location:
    snippet: print(valueA==valueB)
  explanations:
  - body: The __eq__ method of each class is called when the == operator is used on an instance of each
      class. In this example, whether the value of a equals the value of b is checked. When the __eq__
      method is called, it prints a statement as well as returns a bool representing the equality of the
      two instances.
  - body: The __eq__ method in class A is called first and the __eq__ method in class B is called second,
      because the instance of class A (valueA) appears first (on the left side of the == operator).
