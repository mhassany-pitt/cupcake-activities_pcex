- type: explanation
  location:
    snippet: 'if num1 < num2 :'
  explanations:
  - body: We find the minimum by finding the smallest of the first two integers and then comparing the
      smallest value with the third integer. Here, we perform the first test (finding smallest of the
      first two integers) by comparing num1 and num2.
  - body: If num1 is the smallest, then the body of this if statement gets executed. Otherwise, the body
      of this if statement is skipped.
- type: explanation
  location:
    snippet: 'if num1 < num3 :'
  explanations:
  - body: When num1 is the smallest of num1 and num2, we need to compare num1 (smallest of the first two
      integers) with the third integer.
  - body: If num1 (smallest of the first two integers) is also smaller than num3, then the body of this
      if statement gets executed and num1 is the minimum. Otherwise, the body of this if statement is
      skipped.
- type: explanation
  location:
    snippet: min_num = num1
  explanations:
  - body: When num1 (smallest of the first two numbers) is also smaller than the third number, num1 is
      the minimum of the three integers and we assign it to variable min_num.
- type: explanation
  location:
    snippet: 'else :'
    nth: 1
  explanations:
  - body: When num1 (smallest of the first two integers) is not smaller than num3, then we could conclude
      that num3 is the minimum
  - body: The statement inside the body of this else statement gets executed when the if condition is
      False, i.e., when num1 (smallest of the first two integers) is not smaller than num3. Otherwise,
      the body of this else statement is skipped.
- type: explanation
  location:
