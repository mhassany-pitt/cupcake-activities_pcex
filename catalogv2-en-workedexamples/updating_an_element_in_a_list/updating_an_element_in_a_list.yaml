executions:
- title: Sample Run
  stdin: []
  stdout: '[2, 100, 39]'
  console: '[2, 100, 39]'
  stderr: ''
  status: pass
elements:
- type: explanation
  location:
    snippet: lst = [123, 100, 39]
  explanations:
  - body: We want to assign three values to the list. In this statement, we define the list referred by
      variable lst to hold three integer values. We initialize the list by separating elements with a
      comma and enclosing the collection in square brackets [ ].
- type: explanation
  location:
    snippet: lst[0] = 2
  explanations:
  - body: This statement updates the first element of the list to the integer value 2.
  - body: To update an element in the list, we need to give the square bracket slice operator ([ ] ) along
      with an index of the element that we want to update on the left-hand side of the assignment operator.
      The index could start at 0 and continue up to but not including the length of the list. The value
      on the right-hand side of the assignment operator is the new value that we want to assign to the
      list element.
- type: explanation
  location:
    snippet: print(lst)
  explanations:
  - body: We can see the content of the list by calling the print function and passing the list to that.
      This statement prints the list.
