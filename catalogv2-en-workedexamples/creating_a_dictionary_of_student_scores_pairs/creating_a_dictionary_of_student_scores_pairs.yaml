id: we_py_student_score_0
title: 'Creating a Dictionary of Student-Scores Pairs '
description: |-
  Assume we have a list of students and a list of their corresponding test scores. Construct a program that has a function which receives these two lists and returns a dictionary that maps each student to the scores of that student.
  For example, if the student list is ['Sam', 'Kim', 'Sam'] and the scores list is [15, 10, 14], the program creates the following dictionary:
  {'Sam': [15, 14], 'Kim': [10]}
