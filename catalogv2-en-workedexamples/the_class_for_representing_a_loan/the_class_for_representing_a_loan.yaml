- type: explanation
  location:
    snippet: 'annual_interest_rate = float(input("Enter the annual interest rate: "))'
  explanations:
  - body: 'We need to read the value that the user enters for the loan''s annual interest rate. To read
      the user input from command line, we use the input() function. This statement prints a text on the
      screen "Enter the annual interest rate: ", then reads the text entered by the user.<br><br>The value
      that will be read is a string and we need to convert it to a float. We convert the input string
      to its float representation by using the float() function.'
  - body: The conversion of the value from string to float can only be done if the string could be translated
      into a valid floating-point value. Also note that we do not necessarily have to store the returned
      value from the input function in a variable. We could use the input function call directly as the
      float function parameter.
- type: explanation
  location:
    snippet: 'number_of_years = int(input("Enter the number of years for the loan period: "))'
  explanations:
  - body: 'We need to read and process the value that the user enters for the length of the loan period.
      To read the user input from command line, we use the input() function. This statement prints a text
      on the screen "Enter the number of years for the loan period: ", then reads the text entered by
      the user.<br><br>The value that will be read is a string and we need to convert it to an integer.
      We convert the input string to its integer representation by using the int() function.'
  - body: The conversion of the value from string to int can only be done if the string actually presents
      a number. Also note that we do not necessarily have to store the returned value from the input function
      in a variable. We could use the input function call directly as the int function parameter.
- type: explanation
  location:
