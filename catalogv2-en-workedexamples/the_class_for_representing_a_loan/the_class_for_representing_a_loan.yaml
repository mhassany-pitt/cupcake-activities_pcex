    snippet: 'print("The monthly payment for the loan is: {:.2f} ".format(loan1.get_monthly_payment()))'
  explanations:
  - body: This statement prints the monthly payments on the loan. We get the amount of monthly payments
      by invoking the method get_monthly_payment of loan. Note that loan1 is the implied subject (instance)
      passed to self in both methods.<br>{:.2f} prints the amount of monthly payments with two decimal
      digits.
  - body: Note that we do not necessarily have to store the returned value from the invoked method in
      a variable. We could use the returned value directly in the format method.
  - body: The format function returns the result of replacing each {…} placeholder in the template string
      with its corresponding argument passed to the format function. Anything else, which is not contained
      in curly braces will be literally printed, i.e. without any changes.
  - body: 'The format specification inside a pair of curly braces starts with a : and followed by the
      text that specifies the data type. The data type f requires a floating-point argument. An error
      will occur if the argument is not the expected data type.'
