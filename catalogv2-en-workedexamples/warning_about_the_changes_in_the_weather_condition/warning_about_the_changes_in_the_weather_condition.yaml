id: we_py_nested_if_temperature_0
title: Warning about the Changes in the Weather Condition
description: Construct a program that receives the temperature for today and yesterday and warns the user
  when it is getting colder or warmer or neither. The temperature values could have a decimal point.
authors:
- first: Roya
  last: Hosseini
  email: moh70@pitt.edu
  affiliation: University of Pittsburgh
pedagogy:
  activity: worked-example
  difficulty: novice
  prereq_topics: []
  topics: []
runtime:
  language: python
  version: 3
statement: Write a program that receives the temperature for today and yesterday and warns the user when
  it is getting colder or warmer or neither. The temperature values could have a decimal point.
executions:
- title: Sample Run
  stdin:
  - '83.2'
  - '79.0'
  stdout: "Enter the yesterday's temperature: \nEnter the today's temperature: \nIt is getting colder!"
  console: "Enter the yesterday's temperature: \nEnter the today's temperature: \nIt is getting colder!"
  stderr: ''
  status: pass
elements:
- type: explanation
  location:
    snippet: 'text = input("Enter the yesterday''s temperature: ")'
  explanations:
  - body: We need to read and process the input value that the user enters. To read the input value from
      the user, we need to use the input() function. This statement prompts the user to enter the yesterday's
      temperature, then reads the text entered by the user and places it in the variable text. The value
      that will be stored in variable text is a string.
- type: explanation
  location:
    snippet: yesterday = float(text)
  explanations:
  - body: We need to convert the input text to its float representation because temperature could have
      a decimal point. For this purpose, we use the conversion function float().
  - body: Note that this can only be done if user input could be translated into a valid floating-point
      value.
- type: explanation
  location:
    snippet: 'text = input("Enter the today''s temperature: ")'
  explanations:
  - body: We need to read and process the input value that the user enters. To read the input value from
      the user, we need to use the input() function. This statement prompts the user to enter the today's
      temperature, then reads the text entered by the user and places it in the variable text. The value
      that will be stored in variable text is a string.
- type: explanation
  location:
    snippet: today = float(text)
  explanations:
  - body: We need to convert the input text to its float representation because temperature could have
      a decimal point. For this purpose, we use the conversion function float().
  - body: Note that this can only be done if user input could be translated into a valid floating-point
      value.
- type: explanation
  location:
    snippet: 'if  today < yesterday :'
  explanations:
  - body: 'There are three possible ways the temperature could change: it could get colder, warmer, or
      it could stay the same. We could determine how the temperature is changing by comparing the today''s
      temperature with yesterday''s temperature.<br>One way that we could compare these two temperatures
      is to first check if today''s temperature is less than yesterday''s temperature. If it is, then
      it''s getting colder. If it is not, we could perform another test to check if today''s temperature
      is greater than yesterday''s temperature. If it, then it''s getting warmer. If it is not, then we
      could conclude that today''s temperature is the same as yesterday''s temperature.<br><br>The conditions
      that we want to use to compare the temperatures are mutually exclusive (i.e., one and only one of
      the conditions can be True) therefore, their order does not matter. Also, it is better to use if-else
      statements instead of sequential if statements because the temperature could change in only one
      way and once one of the tests evaluates to True, we don''t need to perform more tests.'
  - body: We start by checking whether the today's temperature is less than yesterday's temperature. If
      it is, then the body of this if statement gets executed. Otherwise, the body of this if statement
      is skipped.
- type: explanation
  location:
    snippet: print("It is getting colder!")
  explanations:
  - body: This statement prints that it's getting colder. The printed text is followed by the end-of-line
      character at the end.
- type: explanation
  location:
    snippet: 'else :'
    nth: 1
  explanations:
  - body: The statement inside the body of the else statement gets executed when the if condition evaluates
      to False, i.e., when today's temperature is not less than yesterday's temperature. Otherwise, the
      body of the else statement is skipped.
- type: explanation
  location:
    snippet: 'if  today > yesterday :'
  explanations:
  - body: If the first test fails (i.e., when today's temperature is not less than yesterday's temperature),
      we need to test if today's temperature is greater than yesterday's temperature.
  - body: If the first test fails (i.e., when today's temperature is not less than yesterday's temperature),
      the body of the previous if statement will not be executed, instead the program reaches this if
      statement, where we test whether the today's temperature is greater than yesterday's temperature.<br><br>If
      today's temperature is greater than yesterday's temperature, then the body of this if statement
      gets executed. Otherwise, the body of this if statement is skipped.
- type: explanation
  location:
    snippet: print("It is getting warmer!")
  explanations:
  - body: This statement prints that it's getting warmer. The printed text is followed by the end-of-line
      character at the end.
- type: explanation
  location:
    snippet: 'else :'
    nth: 2
  explanations:
  - body: The statement inside the body of the else statement gets executed when all of the previous if
      conditions evaluates to False, i.e., when today's temperature is the same as yesterday's temperature.
      Otherwise, the body of this else statement is skipped.
- type: explanation
  location:
    snippet: print("Temperature is the same as yesterday!")
  explanations:
  - body: This statement prints that today's temperature is the same as yesterday's temperature. The printed
      text is followed by the end-of-line character at the end.
