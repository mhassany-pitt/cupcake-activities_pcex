elements:
- type: explanation
  location:
    snippet: 'class Point1 :'
  explanations:
  - body: We define the class named Point1 to represent a point in the Euclidean plane.
- type: explanation
  location:
    snippet: 'def translate(self, dx, dy) :'
  explanations:
  - body: This method shifts the coordinates of the point by a specific delta-x (dx) and delta-y (dy),
      which are passed as parameters. The first argument (named self) is passed in automatically by the
      interpreter when the method is invoked on an instance of the class. The second and third arguments
      are the amount that we want to shift the x-coordinate and y-coordinate of the point, respectively.
  - body: Note that Python automatically fills the first argument in with the instance object that is
      the implied subject of the method call. Therefore, when this method is invoked on an instance of
      the class, only the last two parameters (dx and dy) must be passed to the method.
- type: explanation
  location:
    snippet: self.__x += dx
  explanations:
  - body: To shift the x-coordinate of the point, we need to add dx to the x-coordinate of that point.<br>self
      is the instance of the class and self.__x is the x-coordinate of the instance. We start the attribute
      name by two underscore (self.__x) to prevent accessing the attribute directly from outside of the
      class.
  - body: The += operator adds the value on the right-hand side of the assignment operator (i.e., value
      of variable dx) to the current value of the variable on the left-hand side (i.e., value of the instance
      attribute self.__x) and the result is stored in the instance attribute (self.__x). Thus, this statement
      is equivalent to the statement self.__x = self.__x + dx.
- type: explanation
  location:
    snippet: self.__y += dy
  explanations:
  - body: To shift the y-coordinate of the point, we need to add dy to the y-coordinate of that point.<br>self
      is the instance of the class and self.__y is the y-coordinate of the instance. We start the attribute
      name by two underscore (self.__y) to prevent accessing the attribute directly from outside of the
      class.
  - body: The += operator adds the value on the right-hand side of the assignment operator (i.e., value
      of variable dy) to the current value of the variable on the left-hand side (i.e., value of the instance
      attribute self.__y) and the result is stored in the instance attribute (self.__y). Thus, this statement
      is equivalent to the statement self.__y = self.__y + dy.
- type: explanation
  location:
    snippet: 'def set_x(self, new_x) :'
  explanations:
  - body: This method sets the x-coordinate of the point to the given value (new_x) that is specified
      as the method's parameter. The first argument (named self) is passed in automatically by the interpreter
      when the method is invoked on an instance of the class.
  - body: Note that Python automatically fills the first argument in with the instance object that is
      the implied subject of the method call. Therefore, when this method is invoked on an instance of
      the class, only the last parameter (new_x) must be passed to the method.
- type: explanation
  location:
    snippet: self.__x = new_x
  explanations:
  - body: This statement sets the x-coordinate of the point to the given value (new_x).<br>self is the
      instance of the class and self.__x is the x-coordinate of the instance. We start the attribute name
      by two underscore (self.__x) to prevent accessing the attribute directly from outside of the class.
- type: explanation
  location:
    snippet: 'def get_x(self) :'
  explanations:
  - body: This method returns the x-coordinate of the point. The argument (named self) is passed in automatically
      by the interpreter when the method is invoked on an instance of the class.
  - body: Note that Python automatically fills the first argument in with the instance object that is
      the implied subject of the method call. Therefore, when this method is invoked on an instance of
      the class, no parameter must be passed to the method.
- type: explanation
  location:
    snippet: return self.__x
  explanations:
  - body: This statement returns the x-coordinate of the point.<br>self is the instance of the class and
      self.__x is the x-coordinate of the instance. We start the attribute name by two underscore (self.__x)
      to prevent accessing the attribute directly from outside of the class.
- type: explanation
  location:
    snippet: 'def set_y(self, new_y) :'
  explanations:
  - body: This method sets the y-coordinate of the point to the given value (new_y) that is specified
      as the method's parameter. The first argument (named self) is passed in automatically by the interpreter
      when the method is invoked on an instance of the class.
  - body: Note that Python automatically fills the first argument in with the instance object that is
      the implied subject of the method call. Therefore, when this method is invoked on an instance of
      the class, only the last parameter (new_y) must be passed to the method.
- type: explanation
  location:
    snippet: self.__y = new_y
  explanations:
  - body: This statement sets the y-coordinate of the instance to the given value (new_y).<br>self is
      the instance of the class and self.__y is the y-coordinate of the instance. We start the attribute
      name by two underscore (self.__y) to prevent accessing the attribute directly from outside of the
      class.
- type: explanation
  location:
    snippet: 'def get_y(self) :'
  explanations:
  - body: This method returns the y-coordinate of the point. The argument (named self) is passed in automatically
      by the interpreter when the method is invoked on an instance of the class.
  - body: Note that Python automatically fills the first argument in with the instance object that is
      the implied subject of the method call. Therefore, when this method is invoked on an instance of
      the class, no parameter must be passed to the method.
- type: explanation
  location:
    snippet: return self.__y
  explanations:
  - body: This statement returns the y-coordinate of the point.<br>self is the instance of the class and
      self.__y is the y-coordinate of the instance. We start the attribute name by two underscore (self.__y)
      to prevent accessing the attribute directly from outside of the class.
- type: explanation
  location:
    snippet: p1 = Point1()
  explanations:
  - body: We create an instance of the class Point1 to demonstrate the creation and use of Point1 instances.
  - body: This statement creates a Point1 instance. The variable p1 holds a reference to a Point1 instance.
- type: explanation
  location:
    snippet: p1.set_x(7)
  explanations:
  - body: This statement invokes the method set_x of p1 to set its x-coordinate to 7. Note that p1 is
      the implied subject (instance) passed to self.
- type: explanation
  location:
    snippet: p1.set_y(2)
  explanations:
  - body: This statement invokes the method set_y of p1 to set its y-coordinate to 2. Note that p1 is
      the implied subject (instance) passed to self.
- type: explanation
  location:
    snippet: p1.translate(11, 6)
  explanations:
  - body: This statement invokes the method translate of p1. The translate method receives two parameters.
      The first parameter specifies how much we want to shift the x-coordinate of p1. The second parameter
      specifies how much we want to shift the y-coordinate of p1. Also, p1 is the implied subject (instance)
      passed to self.<br>Note that this method must be called after the set_x and set_y methods are called.
  - body: An error would occur if we call the translate method before we call the set_x and set_y methods.
      Because the class Point1 doesn't have a __init__() method that initialize the coordinates of the
      point. So by the time p1 is instantiated, the coordinates of p1 are not present. Therefore, We must
      first call the set_x and set_y methods to set the values of the coordinates.
- type: explanation
  location:
    snippet: 'print("p1 coordinates: (" + str(p1.get_x()) + ", " + str(p1.get_y()) + ")")'
  explanations:
  - body: This statement concatenates the content of the given strings and variables to print the coordinates
      of p1. To get p1's coordinates, we invoke the method get_x and get_y of p1. Note that we do not
      necessarily have to store the returned value from each of these methods in a variable. We could
      use the returned value of them directly in the print statement.
  - body: We concatenate the content of p1 coordinates with the other strings using the + operator. The
      coordinates of the point hold integer values and their values can be concatenated with strings only
      when they're explicitly converted to a string using the str function.
  - body: Note that the concatenating and printing are done in the same line. That is, we don't have to
      store the concatenated string to a new variable at first and then print it in the next line.
  - body: Note that the + operator creates a new string from the contents of its operands joined. This
      string will be printed by the print function and followed by the end-of-line character at the end.
