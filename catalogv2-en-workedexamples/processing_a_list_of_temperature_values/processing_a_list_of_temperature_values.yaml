id: we_py_temperature_0
title: Processing a List of Temperature Values
description: Construct a program that reads a series of temperatures and reports the average temperature
  and the number of the days that are above the average. Assume that the input values could have a decimal
  point.
authors:
- first: Roya
  last: Hosseini
  email: moh70@pitt.edu
  affiliation: University of Pittsburgh
pedagogy:
  activity: worked-example
  difficulty: novice
  prereq_topics: []
  topics: []
runtime:
  language: python
  version: 3
statement: Write a program that reads a series of temperatures and reports the average temperature and
  the number of the days that are above the average. Assume that the input values could have a decimal
  point.
executions:
- title: Sample Run
  stdin:
  - '5'
  - '28.5'
  - '31.7'
  - '45.3'
  - '49.1'
  - '31.9'
  stdout: "Enter the number of temperature values that will be entered: \nEnter the temperature: \nEnter\
    \ the temperature: \nEnter the temperature: \nEnter the temperature: \nEnter the temperature: \nAverage\
    \ temperature: 37.3\n2 days above average."
  console: "Enter the number of temperature values that will be entered: \nEnter the temperature: \nEnter\
    \ the temperature: \nEnter the temperature: \nEnter the temperature: \nEnter the temperature: \nAverage\
    \ temperature: 37.3\n2 days above average."
  stderr: ''
  status: pass
elements:
- type: explanation
  location:
    snippet: 'num_days = int(input("Enter the number of temperature values that will be entered: "))'
  explanations:
  - body: 'We need to first ask the user how many days of temperature data will be provided. To read the
      user input from command line, we use the input() function. This statement prints a text on the screen
      "Enter the number of temperature values that will be entered: ", then reads the text entered by
      the user.<br><br>The value that will be read is a string and we need to convert it to a int. We
      convert the input string to its integer representation by using the int() function.'
  - body: Note that we do not necessarily have to store the returned value from the input function in
      a variable. We could use the input function call directly as the int function parameter.
  - body: Note that the conversion to integer can only be done if the string actually presents a number.
      If the input number is a float, the int() function cuts off the fractional part of the floating-point
      number to create an integer.
- type: explanation
  location:
    snippet: temps = []
  explanations:
  - body: We first need to define a list referred by variable temps for storing the temperatures that
      the user provides. We initialize it with an empty list and will later use the function append to
      add each temperature value to it. We need this list later to iterate over the temperature values
      and calculate the number of the days that are above the average.
- type: explanation
  location:
    snippet: total = 0
  explanations:
  - body: We need variable total to maintain a running total, which means the sum of the temperature values
      that the user has entered so far. Of course, the total should be initialized with 0.
- type: explanation
  location:
    snippet: 'for i in range(num_days):'
  explanations:
  - body: We want to read each temperature value and calculate the running total for the temperature values
      that the user has entered so far.<br><br>We also need to add each temperature value in the list
      to later count the number of days that are above the average. Therefore, we use a for loop to iterate
      over the list indexes and add a temperature value to each index.
  - body: We need the list indexes to have a length of num_days and start at 0 with every integer number
      up to but not including num_days, where variable num_days is the number of days for which the user
      will provide the temperature values. We get this sequence by calling the range(num_days) function.
  - body: Note that all statements inside the loop need to be indented with respect to the loop header.
- type: explanation
  location:
    snippet: 'val = float(input("Enter the temperature: "))'
  explanations:
  - body: 'We need to read the temperature value that the user enters. To read the user input from command
      line, we use the input() function. This statement prints a text on the screen "Enter the temperature:
      ", then reads the text entered by the user.<br><br>The value that will be read is a string and we
      need to convert it to a float. We convert the input string to its float representation by using
      the float() function.'
  - body: The conversion of the value from string to float can only be done if the string could be translated
      into a valid floating-point value. Also note that we do not necessarily have to store the returned
      value from the input function in a variable. We could use the input function call directly as the
      float function parameter.
- type: explanation
  location:
    snippet: temps.append(val)
  explanations:
  - body: We want to add the temperature value that the user has entered to the list. To do this, in each
      iteration, we call the function append() to add the value read to the end of the list.
- type: explanation
  location:
    snippet: total += val
  explanations:
  - body: We need to add each value read to the running total that is stored in variable total. So, in
      each iteration, we add the value read stored in variable val to the variable total and store the
      result into the variable total.
  - body: The += operator adds the value of variable val to the value of the variable total and the result
      is stored in the variable total. Thus, this statement is equivalent to the statement total = total
      + val.
- type: explanation
  location:
    snippet: average = 0
  explanations:
  - body: We need variable average to store the average of the temperature values that the user has entered.
- type: explanation
  location:
    snippet: 'if num_days == 0:'
  explanations:
  - body: We need the if statement before computing the average to avoid a divide-by-zero error. This
      occurs if the user enters 0 for the number of days.
  - body: If the user enters 0 for the number of days, then the body of this if statement gets executed.
      Otherwise, the body of this if statement is skipped.
- type: explanation
  location:
    snippet: print("No temperature values were entered.")
  explanations:
  - body: This statement prints the text "No temperature values were entered." to the default standard
      output stream. This text is followed by the end-of-line character at the end.
- type: explanation
  location:
    snippet: 'else:'
  explanations:
  - body: If the first test fails (i.e., when the user enters a positive number greater than zero for
      the number of days), then the body of the previous if statement will not be executed, instead the
      body of this else statement will be executed.
- type: explanation
  location:
    snippet: average = total / num_days
  explanations:
  - body: We need to calculate the average by dividing the sum of the temperature values by the number
      of the days that we received their temperature values.
  - body: Notice that the / operator performs the real division, producing a floating point result.
- type: explanation
  location:
    snippet: above = 0
  explanations:
  - body: We need variable above to count how many temperature values were above average. Of course, it
      should be initialized with 0 because we have not started counting yet.
- type: explanation
  location:
    snippet: 'for x in temps:'
  explanations:
  - body: We want to iterate over the list and count the number of temperature values that are above the
      average. We traverse the list values using for loop because for loop can step across any kind of
      sequence object including lists.
  - body: This for loop assigns the name x to each of the values in the list in turn, from left to right,
      and then the statements in the loop body will be executed for each.
  - body: Note that all statements inside the loop need to be indented with respect to the loop header.
- type: explanation
  location:
    snippet: 'if x > average:'
  explanations:
  - body: We need to compare the list value that we visited with the average of temperature values stored
      in variable average. If that value is greater than the average, then we need to increase the number
      of days above average by 1.
  - body: If visited value in the list is greater than the average, then the body of this if statement
      gets executed. Otherwise, the body of this if statement is skipped.
- type: explanation
  location:
    snippet: above += 1
  explanations:
  - body: When the current temperature value is greater than the average, then we have to increment the
      number of days above the average by 1.
  - body: The += operator adds 1 to the value of variable above and the result is stored into the variable
      above. Therefore, it is functionally equivalent to the statement above = above + 1.
- type: explanation
  location:
    snippet: print("Average temperature:", average)
  explanations:
  - body: This statement prints to the default standard output stream the text "Average temperature:"
      and the value of variable average.<br>The printed text shows the arguments of the print function
      separated by the default delimiter (i.e., single space character) and followed by the end-of-line
      character at the end.
- type: explanation
  location:
    snippet: print(above, "days above average.")
  explanations:
  - body: This statement prints to the default standard output stream the value of variable above and
      the text "days above average.".<br>The printed text shows the arguments of the print function separated
      by the default delimiter (i.e., single space character) and followed by the end-of-line character
      at the end.
