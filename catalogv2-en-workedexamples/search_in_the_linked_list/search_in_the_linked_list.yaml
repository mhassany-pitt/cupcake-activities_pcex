title: Search in the linked list.
description: When using a LinkedList, it is possible that you may want to search through the list to see
  if a specific value is in it. To do so, each node must be checked individually. Construct a search function
  within the LinkedList class that traverses through all nodes in the list and returns True if a given
  target value is within the list.
