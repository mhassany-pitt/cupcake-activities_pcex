elements:
- type: explanation
  location:
    snippet: 'def __init__(self, root):'
  explanations:
  - body: We want to define the __init__ method for the BinaryTree class to take in a root node, so we
      specify the two parameters to be self and root. Recall that self is a required parameter.
- type: explanation
  location:
    snippet: self.left = None
  explanations:
  - body: We set the node to the left of root equal to None (since it doesn’t exist yet
- type: explanation
  location:
    snippet: self.right = None
  explanations:
  - body: We set the node to the left of root equal to None (since it doesn’t exist yet
- type: explanation
  location:
    snippet: self.key = root
  explanations:
  - body: We set the key value of the BinaryTree equal to root
- type: explanation
  location:
    snippet: 'def insert(self, data):'
  explanations:
  - body: We define the insert function here. The insert function compares the value of the node to the
      parent node and decides to add it as a left node or a right node.
- type: explanation
  location:
    snippet: 'if self.key:'
  explanations:
  - body: We first need to check if there is an existing root node
- type: explanation
  location:
    snippet: 'if data < self.key:'
  explanations:
  - body: If the new node smaller than the previous node, we insert it to the left of the previous node.
- type: explanation
  location:
    snippet: 'if self.left is None:'
  explanations:
  - body: If the previous node left is empty, we insert it at the position
- type: explanation
  location:
    snippet: 'else:'
    nth: 1
  explanations:
  - body: If the left is not empty, we recurse the insert function and compare the new node to the current
      left node, in order to decide where to insert the new node.
- type: explanation
  location:
    snippet: 'elif data > self.key:'
  explanations:
  - body: If the new node smaller than the previous node, we insert it to the left.
- type: explanation
  location:
    snippet: 'if self.right is None:'
  explanations:
  - body: If the previous node left is empty, we insert it at the  position.
- type: explanation
  location:
    snippet: 'else:'
    nth: 2
  explanations:
  - body: If the left is not empty, we recurse the insert function and compare the new node to the current
      right node, in order to decide where to insert the new node.
- type: explanation
  location:
    snippet: 'else:'
    nth: 3
  explanations:
  - body: If there is no root node exist, the new data will be assigned as the root node.
- type: explanation
  location:
    snippet: 'def inorder_traversal(self, root):'
  explanations:
  - body: We define the in-order traversal algorithm here. In-order traversal algorithm travers the tree
      from the left, the root node and the right.
  - body: Note that this process is repeated for each sub-tree until all the nodes are traversed.
- type: explanation
  location:
    snippet: res = []
  explanations:
  - body: We initiate a list to store the traversed tree node values.
- type: explanation
  location:
    snippet: 'if root:'
  explanations:
  - body: The function runs only when the root exists.
- type: explanation
  location:
    snippet: res = self.inorder_traversal(root.left)
  explanations:
  - body: We recursively visit the left nodes first, then the root node, and last the right nodes.
- type: explanation
  location:
    snippet: return res
  explanations:
  - body: We return the final list that stored the tree values.
