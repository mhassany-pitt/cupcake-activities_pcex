$schema: https://learning-contents.org/schemas/worked-example/0.1.0
source: main.py
license: MIT
locale: en
id: we_py_if_else_grade_0
title: The Grade Letter
description: |
  Construct a program that receives a score from the user and determines the grade as follows:
  A for scores ≥ 90
  B for scores ≥ 80
  C for scores ≥ 70
  D for scores ≥ 60
  F for scores < 60
authors:
- first: Roya
  last: Hosseini
  email: moh70@pitt.edu
  affiliation: University of Pittsburgh
pedagogy:
  activity: worked-example
  difficulty: novice
  prereq_topics: []
  topics: []
runtime:
  language: python
  version: 3
statement: |
  Write a program that receives a score from the user and determines the grade as follows:
  A for scores ≥ 90
  B for scores ≥ 80
  C for scores ≥ 70
  D for scores ≥ 60
  F for scores < 60
executions:
- title: Sample Run
  stdin:
  - '75'
  stdout: "Enter a score: \nGrade = C"
  console: "Enter a score: \nGrade = C"
  stderr: ''
  status: pass
elements:
- type: explanation
  location:
    snippet: 'text = input("Enter a score: ")'
  explanations:
  - body: We need to read and process the input value that the user enters. To read the input value from
      the user, we need to use the input() function. This statement prompts the user to enter the score,
      then reads the text entered by the user and places it in the variable text. The value that will
      be stored in variable text is a string.
- type: explanation
  location:
    snippet: score = int(text)
  explanations:
  - body: We need to convert the input text to its integer representation. For this purpose, we use the
      conversion function int().
  - body: Note that the conversion to integer can only be done if the string actually presents a number.
      If the input number is a float, the int() function cuts off the fractional part of the floating-point
      number to create an integer.
- type: explanation
  location:
    snippet: 'if score >= 90 :'
  explanations:
  - body: We have 5 possible letter grades that are A, B, C, D, and F. We could determine the letter grade
      for the score by performing four tests that check whether the score range matches the grade A, B,
      C, or D. If all of these tests fail, then we could conclude that the grade is F.<br><br>The conditions
      that we want to use to test the score range are not mutually exclusive (i.e., more than one of the
      conditions can be true, for example, if the score is 85, all the conditions that test whether the
      score is greater than or equal to 60, 70, and 80 evaluate to true) therefore, the order that we
      perform these tests matters and we should test the general conditions only after we have tested
      the specific conditions first. The most specific condition that we have is the one that tests whether
      the score is greater than or equal to 90. The second most specific condition that we have is the
      one that tests whether the score is greater than or equal to 80, and so on. We use if-else if statements
      instead of sequential if statements because we should stop performing the tests as soon as we find
      the test that evaluates to true.<br>Based on what is explained above, we need to first test if the
      score is greater than or equal to 90.
  - body: To check if the letter grade is A, we need to check whether the score is greater than or equal
      to 90.
  - body: If the score is greater than or equal to 90, then the body of this if statement gets executed.
      Otherwise, the body of this if statement is skipped.
- type: explanation
  location:
    snippet: grade = "A"
  explanations:
  - body: This statement assigns A to the grade (only if score is greater than or equal to 90).
- type: explanation
  location:
    snippet: 'elif score >= 80 :'
  explanations:
  - body: If the first test fails (i.e., when score is less than 90), we need to test if the score is
      greater than or equal to 80.
  - body: If the first test fails (i.e., when score is less than 90), the body of the previous if statement
      will not be executed, instead the program jumps to this else if statement, where we test whether
      the score is greater than or equal to 80.<br><br>If score is greater than or equal to 80, then the
      body of the else if statement is executed. Otherwise, the body of the else if statement is skipped.
- type: explanation
  location:
    snippet: grade = "B"
  explanations:
  - body: This statement assigns B to the grade only if the first if statement is false (i.e., when score
      is less than 90) and the else if statement is true (i.e., when score is greater than or equal to
      80).
- type: explanation
  location:
    snippet: 'elif score >= 70 :'
  explanations:
  - body: If all of the above tests fail, we need to test if the score is greater than or equal to 70.
  - body: If all of the above tests fail, the body of the previous else if statement will not be executed,
      instead the program jumps to this else if statement, where we test whether the score is greater
      than or equal to 70.<br><br>If score is greater than or equal to 70, then the body of this else
      if statement gets executed. Otherwise, the body of this else if statement is skipped.
- type: explanation
  location:
    snippet: grade = "C"
  explanations:
  - body: This statement assigns C to the grade only if the previous tests fail, i.e., when the score
      is greater than or equal to 70 but less than 80.
- type: explanation
  location:
    snippet: 'elif score >= 60 :'
  explanations:
  - body: If all of the above tests fail, we need to test if the score is greater than or equal to 60.
  - body: If all of the above tests fail, the body of the previous else if statement will not be executed,
      instead the program jumps to this else if statement, where we test whether the score is greater
      than or equal to 60.<br><br>If score is greater than or equal to 60, then the body of this else
      if statement gets executed. Otherwise, the body of this else if statement is skipped.
- type: explanation
  location:
    snippet: grade = "D"
  explanations:
  - body: This statement assigns D to the grade only if the previous tests fail, i.e., when the score
      is greater than or equal to 60 but less than 70.
- type: explanation
  location:
    snippet: 'else :'
  explanations:
  - body: We need to end the above if-else if statements with an else statement that its body is executed
      when none of the above tests are true, that is when the score is less than 60.
  - body: The body of the else statement gets executed only if the score is less than 60.
  - body: Note than when we end series of if-else if statements with an else statement, we make sure to
      execute the body of exactly one of those statements.
- type: explanation
  location:
    snippet: grade = "F"
  explanations:
  - body: This statement assigns F to the grade only if all of the previous tests fail, i.e., when the
      score is less than 60.
- type: explanation
  location:
    snippet: print("Grade =", grade)
  explanations:
  - body: This statement prints to the default standard output stream the text "Grade =" and the value
      of variable grade.<br>The printed text shows the arguments of the print function separated by the
      default delimiter (i.e., single space character) and followed by the end-of-line character at the
      end.
