elements:
- type: explanation
  location:
    snippet: 'class Queue:'
  explanations:
  - body: We define the class named Queue to represent a Queue structure.
- type: explanation
  location:
    snippet: 'def __init__(self):'
  explanations:
  - body: We want to initialize the Queue. We do this by defining an __init__ method, which is run automatically
      by Python each time an instance is created. The argument (named self) is passed in automatically
      by the interpreter when the method is invoked on an instance of the class.
  - body: Note that Python automatically fills the first argument in with the instance object that is
      the implied subject of the method call. Therefore, when this method is invoked on an instance of
      the class, no parameter must be passed to the method.
- type: explanation
  location:
    snippet: self.items =[]
  explanations:
  - body: This statement initiates an empty list. self is the instance of the class and self.items created
      an empty list.
- type: explanation
  location:
    snippet: 'def enqueue(self, item):'
  explanations:
  - body: This method adds a new element to the list (item) that is specified as the method's parameter.
      The first argument (named self) is passed in automatically by the interpreter when the method is
      invoked on an instance of the class.
  - body: Note that Python automatically fills the first argument in with the instance object that is
      the implied subject of the method call. Therefore, when this method is invoked on an instance of
      the class, only the last parameter (item) must be passed to the method.
- type: explanation
  location:
    snippet: self.items.insert(0,item)
  explanations:
  - body: This statement uses the built-in function insert() to add the last parameter (item) to the initialized
      list.
- type: explanation
  location:
    snippet: 'def dequeue(self):'
  explanations:
  - body: This method dequeues the last element out of the list. The argument (named self) is passed in
      automatically by the interpreter when the method is invoked on an instance of the class.
  - body: Note that Python automatically fills the first argument in with the instance object that is
      the implied subject of the method call. Therefore, when this method is invoked on an instance of
      the class, no parameter must be passed to the method.
- type: explanation
  location:
    snippet: return self.items.pop()
  explanations:
  - body: This statement return the dequeued element by using the built-in function pop(). By default,
      pop() function pops the last element in the list
- type: explanation
  location:
    snippet: 'def __str__(self):'
  explanations:
  - body: The __str__ method in Python represents the class objects as a string, which is called when
      the built-in functions print() and str() are invoked on the object and return a string.
  - body: Note that Python automatically fills the first argument in with the instance object that is
      the implied subject of the method call. Therefore, when this method is invoked on an instance of
      the class, no parameter must be passed to the method.
- type: explanation
  location:
    snippet: return str(self.items)
  explanations:
  - body: This statement returns a string. We use the built-in function str() to convert all the elements
      in the list to string.
- type: explanation
  location:
    snippet: q=Queue()
  explanations:
  - body: We create an instance of the class Queue to demonstrate the creation and use of Queue instances.
  - body: This statement creates a Queue instance. The variable q holds a reference to a Queue instance.
- type: explanation
  location:
    snippet: q.enqueue('cat')
  explanations:
  - body: This statement invokes the method enqueue() of q to pass the parameter ‘cat’ and add it to the
      list. Note that q is the implied subject (instance) passed to self.
- type: explanation
  location:
    snippet: q.enqueue(3)
  explanations:
  - body: This statement invokes the method enqueue() of q to pass the parameter 3 and add it to the list.
      Note that q is the implied subject (instance) passed to self.
- type: explanation
  location:
    snippet: print(q.dequeue())
  explanations:
  - body: This statement prints the dequeued element of the list. To get the dequeued element, we invoke
      the method dequeue() of q. Note that we do not necessarily have to store the returned value of this
      method in a variable. We could use the returned value directly in the print statement.
- type: explanation
  location:
    snippet: print(q)
  explanations:
  - body: This statement invoke the _str_ method and return the current list as a string.
